  // We temporarily disable Quill when an input/textarea inside our widgets is focused, and re-enable on exit.
  const maybeDisableQuillForWidget = (targetEl) => {

      st.__quillDisabledByWidget = false;

const getLineInfoAtIndex = (qq, index) => {

const getGroupRangeAtIndex = (qq, index) => {

const moveKpNoteLine = (noteEl, dir) => {
  const st = root.__trpgSkillKpState;
  if (!st || st.isView) return;
  const qq = st.q;
  if (!qq) return;

  const cur = getGroupRangeAtEmbed(qq, noteEl);
  if (!cur) return;

  let probe;
  if (dir < 0) {
    if (cur.start <= 0) return;
    probe = cur.start - 1;
  } else {
    probe = cur.start + cur.len;
    if (probe >= qq.getLength() - 1) return;
  }

  const adj = getGroupRangeAtIndex(qq, probe);
  if (!adj) return;

  // Ensure the two groups are truly adjacent (no gap).
  if (dir < 0) {
    if (adj.start + adj.len !== cur.start) return;
  } else {
    if (cur.start + cur.len !== adj.start) return;
  }

  // DOM直接swapで移動（getContents→concatはsoftbreak値の問題で分割が起きるため回避）
  // curBlot/adjBlotのDOMノードをquill.root内で直接入れ替える
  try {
    const curBlot = Quill.find(qq.root.querySelector ? null : null); // fallback to index-based
    const [curLeaf] = qq.getLeaf(cur.start);
    const [adjLeaf] = qq.getLeaf(adj.start);
    const curLine = curLeaf ? curLeaf.parent : null;
    const adjLine = adjLeaf ? adjLeaf.parent : null;

    // Blotのlineを取得
    const getCurLine = () => {
      const [line] = qq.getLine(cur.start);
      return line;
    };
    const getAdjLine = () => {
      const [line] = qq.getLine(adj.start);
      return line;
    };

    const curLineBlot = getCurLine();
    const adjLineBlot = getAdjLine();

    if (!curLineBlot || !adjLineBlot) throw new Error('line not found');

    const curNode = curLineBlot.domNode;
    const adjNode = adjLineBlot.domNode;
    const parent = curNode.parentNode;

    if (!parent || adjNode.parentNode !== parent) throw new Error('different parents');

    // DOM swap
    if (dir < 0) {
      // adjNode が curNode の前にある → curNode を adjNode の前に移動
      parent.insertBefore(curNode, adjNode);
    } else {
      // adjNode が curNode の後にある → adjNode を curNode の前に移動
      parent.insertBefore(adjNode, curNode);
    }

    // Quillに変更を通知（silent でDOMの変化をDeltaに反映）
    qq.update('silent');

    st.markDirty && st.markDirty();

    // 移動後の新しい位置にフォーカス
    const newStart = dir < 0 ? adj.start : cur.start;
    focusWidgetAtIndex(qq, newStart, '.kp-note', '.kp-note-text');
    qq.setSelection(Math.min(newStart + 1, qq.getLength() - 1), 0, 'silent');
  } catch {
    // DOM swapに失敗した場合のフォールバック：従来のDelta方式
    const Delta = Quill.import('delta');
    const firstStart = Math.min(cur.start, adj.start);
    const secondStart = Math.max(cur.start, adj.start);
    const secondEnd = secondStart + (secondStart === cur.start ? cur.len : adj.len);
    const deleteLen = secondEnd - firstStart;

    const curDelta = qq.getContents(cur.start, cur.len);
    const adjDelta = qq.getContents(adj.start, adj.len);

    let insertDelta;
    let newStart;
    if (dir < 0) {
      insertDelta = new Delta().concat(curDelta).concat(adjDelta);
      newStart = adj.start;
    } else {
      insertDelta = new Delta().concat(adjDelta).concat(curDelta);
      newStart = cur.start + adj.len;
    }

    qq.updateContents(new Delta().retain(firstStart).delete(deleteLen).concat(insertDelta), 'user');
    st.markDirty && st.markDirty();

    focusWidgetAtIndex(qq, newStart, '.kp-note', '.kp-note-text');
    qq.setSelection(Math.min(newStart + 1, qq.getLength() - 1), 0, 'silent');
  }
};

      if (!widget) return;
      e.preventDefault(); e.stopPropagation();
      try {
        const blot = Quill.find(widget);
        const st2 = root.__trpgSkillKpState;
        const qq = st2 && st2.q ? st2.q : null;
        if (!qq || !blot) return;
        const at = qq.getIndex(blot);
        const [line, offset] = qq.getLine(at);
        if (!line) return;
        const start = at - offset;
        const len = line.length();
        qq.deleteText(start, len, 'user');
        st2.markDirty && st2.markDirty();
      } catch {}
      return;
    }

    // 技能コピー
    const skillBtn = target.closest('.skill-copy-btn');
    if (skillBtn) {
      const widget = skillBtn.closest('.skill-check-widget');
      if (!widget) return;
      e.preventDefault(); e.stopPropagation();
      const kind = String(skillBtn.dataset.result || '');
      const ta = widget.querySelector('.skill-textarea[data-result="' + kind + '"]');
      const txt = String(ta ? ta.value : '').replace(/\s+$/,'');
      if (!txt) return;
      const ok = await copyTextToClipboard(txt);
      if (ok) {
        const col = skillBtn.closest('.skill-check-col');
        if (col) {
          col.classList.add('skill-flash');
          setTimeout(() => { try { col.classList.remove('skill-flash'); } catch {} }, 450);
        }
        showToast('コピーしました！');
      } else {
        showToast('コピーに失敗しました（ブラウザ設定をご確認ください）');
      }
      return;
    }

    // KPメモ操作
    const kpUp = target.closest('.kp-note-btn.up');
    if (kpUp) {
      if (view) return;
      e.preventDefault(); e.stopPropagation();
      moveKpNoteLine(kpUp.closest('.kp-note'), -1);
      return;
    }
    const kpDown = target.closest('.kp-note-btn.down');
    if (kpDown) {
      if (view) return;
      e.preventDefault(); e.stopPropagation();
      moveKpNoteLine(kpDown.closest('.kp-note'), +1);
      return;
    }
    const kpCopy = target.closest('.kp-note-btn.copy');
    if (kpCopy) {
      const note = kpCopy.closest('.kp-note');
      if (!note) return;
      e.preventDefault(); e.stopPropagation();
      const ta = note.querySelector('.kp-note-text');
      const txt = String(ta ? ta.value : '').replace(/\s+$/,'');
      if (!txt) return;
      const ok = await copyTextToClipboard(txt);
      showToast(ok ? 'コピーしました！' : 'コピーに失敗しました（ブラウザ設定をご確認ください）');
      return;
    }
    const kpDel = target.closest('.kp-note-btn.del');
    if (kpDel) {
      if (view) return;
      const note = kpDel.closest('.kp-note');
      if (!note) return;
      e.preventDefault(); e.stopPropagation();
      deleteKpNoteLine(note);
      return;
    }
  }, true);
}


function createQuill(container, content, isView, onContentChange) {
    // ツールバー設定：ここに copybox を明示的に追加
    const toolbarOptions = isView ? false : {
      container: [
        [{ 'header': [1, 2, 3, false] }, 'bold', 'italic', 'underline', { 'color': [] }, { 'background': [] }, 'image'],
        ['copybox', 'skillcheck', 'kpnote', 'pctag'],
        ['clean']
      ]
    };

    const q = new Quill(container, {
      theme: 'snow',
      modules: {
        toolbar: toolbarOptions,
        history: false
      },
      readOnly: isView,
      // カスタムBlotが閲覧モードで消えないように formats を明示
      formats: [
        'header','size','bold','italic','underline','strike','color','background',
        'list','link','image',
        'copybox','break','softbreak','imgGallery','skillcheck','kpnote','kpanchor','pctag','ccfolia'
      ]
    });
      try{ attachKpAnchorSafety(q); }catch{}
      try{ container.__quill = q; }catch{}


    // remember last focused editor (for KP panel add button etc.)
    try{
      const activateScene = () => {
        window.__trpg_lastFocusedQuill = q;
        // 全シーンからscene-activeを外し、現在のシーンだけに付与
        const scBlock = container.closest('.scene-block');
        if (scBlock) {
          document.querySelectorAll('.scene-block.scene-active').forEach(el => {
            if (el !== scBlock) el.classList.remove('scene-active');
          });
          scBlock.classList.add('scene-active');
        }
      };
      q.root.addEventListener('focusin', activateScene, true);
      q.root.addEventListener('pointerdown', activateScene, true);
    }catch{}

    // --- Clipboard: copy-box を「1つの箱」のまま復元する ---
    // Quill は <br> を通常の改行（=別ブロック）として解釈しがちで、
    // 閲覧→編集復帰時に copy-box が行ごとに分裂する原因になる。
    // ここでは div.copy-box を読み込む際に、内部の <br> を break 埋め込みとして扱い、
    // 末尾の改行 1つだけに copybox フォーマットを付与して「単一ブロック」として取り込む。
    try {
      const Delta = Quill.import('delta');
      const walkerToDelta = (root) => {
        const d = new Delta();
        const walk = (node) => {
          if (!node) return;
          // Skip remove button
          if (node.nodeType === 1 && node.classList && node.classList.contains('copybox-remove')) return;

          if (node.nodeType === Node.TEXT_NODE) {
            const t = node.nodeValue || '';
            if (t) d.insert(t);
            return;
          }
          if (node.nodeType === 1) {
            const el = /** @type {HTMLElement} */ (node);
            const tag = (el.tagName || '').toUpperCase();
            if (tag === 'BR') {
              d.insert({ softbreak: true });
              return;
            }
            // ★ 探索者タグを保持する
            if (el.classList && el.classList.contains('pc-tag')) {
              const label = el.getAttribute('data-pc-label') || 'A';
              d.insert({ pctag: label });
              return;
            }
            // Flatten children (copy-box 内は基本的にプレーンテキスト想定)
            Array.from(el.childNodes || []).forEach(walk);
          }
        };
        Array.from(root.childNodes || []).forEach(walk);
        return d;
      };

      q.clipboard.addMatcher('div.copy-box', (node) => {
        const el = /** @type {HTMLElement} */ (node);
        // Clone and strip edit-only controls
        const clone = el.cloneNode(true);
        if (clone.querySelectorAll) {
          clone.querySelectorAll('.copybox-remove').forEach(n => n.remove());
        }
        let d = walkerToDelta(clone);
        // Ensure there is at least one insert so the line exists
        if (!d.ops || d.ops.length === 0) d = new Delta().insert('');
        // End the copy-box block with a single newline formatted as copybox
        d.insert('\n', { copybox: true });
        return d;
      });

      // ★ 探索者タグのclipboard matcher（HTML読み込み時にpc-tagを認識させる）
      q.clipboard.addMatcher('span.pc-tag', (node) => {
        const label = node.getAttribute('data-pc-label') || 'A';
        return new Delta().insert({ pctag: label });
      });

      // ★ 閲覧モードで置換されたpc-tag-resolvedもmatch（閲覧→編集復帰対策）
      q.clipboard.addMatcher('span.pc-tag-resolved', (node) => {
        const title = node.getAttribute('title') || '';
        const label = title.replace('探索者', '').trim() || 'A';
        return new Delta().insert({ pctag: label });
      });

      // ★ ココフォリアマーカー行の復元
      q.clipboard.addMatcher('div.ccfolia-line', (node) => {
        const name = node.getAttribute('data-ccfolia-name') || '';
        const text = node.textContent || '';
        const d = new Delta();
        if (text) d.insert(text);
        d.insert('\n', { ccfolia: name || true });
        return d;
      });
    } catch {
      // If Delta import fails for some reason, fall back to Quill default behavior.
    }

    if (content) {
      // 保存HTMLの行頭nbspをプレースホルダに変換してQuillの正規化を回避
      const NBSP_PH = '\uFFF9';
      const IDESP_PH = '\uFFFA';
      let safeContent = content.replace(/&nbsp;/g, NBSP_PH).replace(/\u00A0/g, NBSP_PH);
      safeContent = safeContent.replace(/\u3000/g, IDESP_PH);
      q.clipboard.dangerouslyPasteHTML(safeContent);
      // 画像参照を表示用の実データへ解決
      try { resolveImagesIn(q.root); } catch {}
      // プレースホルダを復元
      const walker = document.createTreeWalker(q.root, NodeFilter.SHOW_TEXT);
      let tNode;
      while ((tNode = walker.nextNode())) {
        if (tNode.nodeValue && (tNode.nodeValue.includes(NBSP_PH) || tNode.nodeValue.includes(IDESP_PH))) {
          tNode.nodeValue = tNode.nodeValue
            .replace(new RegExp(NBSP_PH, 'g'), '\u00A0')
            .replace(new RegExp(IDESP_PH, 'g'), '\u3000');
        }
      }
    }

    // ★ ペースト時に <p> を段内改行に変換する
    try {
      const Delta = Quill.import('delta');
      q.clipboard.addMatcher('P', (node, delta) => {
        // <p>の内容をそのまま返し、後続要素がある場合のみ末尾に改行1つ追加（段落間に空行を入れない）
        // 最後の<p>に改行を付けると、1段落だけのペーストでカーソル位置の行が割れてしまう
        let next = node.nextSibling;
        while (next && next.nodeType === 3 && !(next.nodeValue || '').trim()) next = next.nextSibling;
        if (!next) return delta;
        return delta.compose(new Delta().retain(delta.length()).insert('\n'));
      });
    } catch {}

    // ★ コピーボックス内へのペーストを横取り：\n を softbreak に変換してブロック分割を防ぐ
    try {
      q.root.addEventListener('paste', (e) => {
        try {
          const range = q.getSelection();
          if (!range) return;
          const fmt = q.getFormat(range.index) || {};

          // --- ココフォリアマーカー行内へのペースト：全行にマーカーを引き継ぐ ---
          if (fmt.ccfolia && !fmt.copybox) {
            e.preventDefault();
            e.stopPropagation();
            const raw = e.clipboardData && e.clipboardData.getData('text/plain');
            if (!raw) return;
            const text = raw.replace(/\r\n?/g, '\n');
            const Delta = Quill.import('delta');
            let d = new Delta().retain(range.index);
            if (range.length > 0) d = d.delete(range.length);
            const lines = text.split('\n');
            while (lines.length > 0 && lines[lines.length - 1] === '') lines.pop();
            let contentLen = 0;
            for (let i = 0; i < lines.length; i++) {
              if (lines[i]) { d = d.insert(lines[i]); contentLen += lines[i].length; }
              if (i < lines.length - 1) { d = d.insert('\n', { ccfolia: fmt.ccfolia }); contentLen += 1; }
            }
            q.updateContents(d, 'user');
            q.setSelection(range.index + contentLen, 0, 'silent');
            return;
          }

          if (!fmt.copybox) return;

          e.preventDefault();
          e.stopPropagation();

          const rawText = e.clipboardData && e.clipboardData.getData('text/plain');
          if (!rawText) return;
          const text = rawText.replace(/\r\n?/g, '\n');  // Windowsクリップボードの\r混入を除去

          // Delta一発構築: retain → delete(選択分) → テキスト+softbreak挿入
          const Delta = Quill.import('delta');
          let d = new Delta().retain(range.index);
          if (range.length > 0) d = d.delete(range.length);

          const lines = text.split('\n');
          // 末尾の空行を除去
          while (lines.length > 0 && lines[lines.length - 1] === '') lines.pop();

          let contentLen = 0;
          for (let i = 0; i < lines.length; i++) {
            if (lines[i]) { d = d.insert(lines[i]); contentLen += lines[i].length; }
            if (i < lines.length - 1) { d = d.insert({ softbreak: true }); contentLen += 1; }
          }

          q.updateContents(d, 'user');
          q.setSelection(range.index + contentLen, 0, 'silent');
        } catch {}
      }, true);
    } catch {}

    // Widgets (技能判定 / KPメモ) の操作・保存・コピー
    setupSkillAndKpWidgets(q, onContentChange, isView);

    // --- KPメモボタン：本文選択位置に🔒アンカー挿入＋マージンにメモ追加 ---
    if (!isView) {
      try {
        const tbMod = q.getModule('toolbar');
        const tbEl = tbMod && tbMod.container ? tbMod.container : null;

        // 1) Quill公式ハンドラ
        try { tbMod && tbMod.addHandler && tbMod.addHandler('kpnote', () => {
          try { createKpMemoAtSelection(q); } catch(e) { console.error(e); }
        }); } catch {}

        // 2) 念のためDOMクリックでも拾う
        if (tbEl && !tbEl.__kpnoteBound) {
          tbEl.__kpnoteBound = true;
          tbEl.addEventListener('click', (ev) => {
            const t = ev.target;
            if (!(t instanceof Element)) return;
            const btn = t.closest('button.ql-kpnote, .ql-kpnote');
            if (!btn) return;
            ev.preventDefault();
            ev.stopPropagation();
            try { createKpMemoAtSelection(q); } catch(e) { console.error(e); }
          }, true);
        }
      } catch {}
    }


    

    // Save helper: always bake widget input values into dataset.payload before saving
    const getHtmlForSave = () => {
      try {
        const st = q.root && q.root.__trpgSkillKpState;
        if (st && typeof st.getHtml === 'function') return st.getHtml();
      } catch {}
      return q.root ? q.root.innerHTML : "";
    };

    // --- 独自スナップショット Undo/Redo ---
    // Quillのhistoryモジュールは複数操作の不完全マージでコピーボックスを壊すため、
    // HTMLスナップショット方式の独自スタックで実装する。
    {
      const SNAP_MAX = 100;
      const undoStack = [];   // [{ html, selIndex, selLength }, ...]
      const redoStack = [];

      let _snapPending = false;
      let _snapLastHtml = null;
      let _suppressSnap = false;
      let _snapTimer = null;
      let _isComposing = false;

      const takeSnapshot = () => {
        if (_suppressSnap || _isComposing) return;
        const html = getHtmlForSave();
        if (html === _snapLastHtml) return;  // 変化がなければ積まない
        _snapLastHtml = html;
        const range = q.getSelection();
        undoStack.push({ html, selIndex: range ? range.index : 0, selLength: range ? range.length : 0 });
        if (undoStack.length > SNAP_MAX) undoStack.shift();
        redoStack.length = 0;  // 新操作でredoをクリア
      };

      // デバウンス予約：連続入力を1つのundo単位にまとめ、大きな文書での毎打鍵シリアライズを防ぐ
      const scheduleSnapshot = () => {
        if (_suppressSnap) return;
        if (_snapTimer) clearTimeout(_snapTimer);
        _snapTimer = setTimeout(() => {
          _snapTimer = null;
          takeSnapshot();
        }, 300);
      };

      // 保留中スナップショットを即時確定（undo/redo/blur時）
      const flushSnapshot = () => {
        if (_snapTimer) { clearTimeout(_snapTimer); _snapTimer = null; }
        takeSnapshot();
      };

      // IME変換中は未確定文字列を積まない。確定後にまとめて撮影
      try {
        q.root.addEventListener('compositionstart', () => { _isComposing = true; });
        q.root.addEventListener('compositionend', () => {
          _isComposing = false;
          scheduleSnapshot();
        });
      } catch {}

      const restoreSnapshot = (snap) => {
        if (!snap) return;
        if (_snapTimer) { clearTimeout(_snapTimer); _snapTimer = null; }  // 古い予約を破棄
        _suppressSnap = true;
        try {
          const NBSP_PH = '\uFFF9';
          const IDESP_PH = '\uFFFA';
          let safe = snap.html.replace(/&nbsp;/g, NBSP_PH).replace(/\u00A0/g, NBSP_PH);
          safe = safe.replace(/\u3000/g, IDESP_PH);
          q.clipboard.dangerouslyPasteHTML(safe);
          try { resolveImagesIn(q.root); } catch {}
          const walker = document.createTreeWalker(q.root, NodeFilter.SHOW_TEXT);
          let tn;
          while ((tn = walker.nextNode())) {
            if (tn.nodeValue && (tn.nodeValue.includes(NBSP_PH) || tn.nodeValue.includes(IDESP_PH))) {
              tn.nodeValue = tn.nodeValue
                .replace(new RegExp(NBSP_PH, 'g'), '\u00A0')
                .replace(new RegExp(IDESP_PH, 'g'), '\u3000');
            }
          }
          // カーソル位置を復元
          try {
            const maxIdx = Math.max(0, q.getLength() - 1);
            q.setSelection(Math.min(snap.selIndex, maxIdx), snap.selLength, 'silent');
          } catch {}
          _snapLastHtml = getHtmlForSave();
          scheduleScenarioSave(onContentChange, getHtmlForSave);
        } catch {}
        _suppressSnap = false;
      };

      // 初期スナップショット：読み込み済みコンテンツをスタック底（基底状態）として積む
      setTimeout(() => {
        _snapLastHtml = getHtmlForSave();
        if (undoStack.length === 0) {
          undoStack.push({ html: _snapLastHtml, selIndex: 0, selLength: 0 });
        }
      }, 0);

      // text-changeで操作後にスナップショット予約
      q.on('text-change', () => {
        scheduleSnapshot();
      });

      // 不変条件：undoStackの先頭（末尾要素）は常に「現在のドキュメント状態」と一致させる
      // undo: 先頭をredoへ移し、新しい先頭を復元
      q.__trpgUndo = () => {
        flushSnapshot();  // 保留中の編集を確定
        // スタック底は基底状態（シーン読み込み時の内容）。それ以前へは戻れない
        if (undoStack.length <= 1) return;
        redoStack.push(undoStack.pop());
        restoreSnapshot(undoStack[undoStack.length - 1]);
      };

      // redo: redoから取り出してundoスタックに積み直し、復元
      q.__trpgRedo = () => {
        flushSnapshot();  // 未確定編集があれば確定（その場合redoStackはクリアされ、redoは無効になる）
        if (redoStack.length === 0) return;
        const target = redoStack.pop();
        undoStack.push(target);
        restoreSnapshot(target);
      };

      // ブラウザネイティブundo（右クリックメニュー・モバイルキーボード等）を横取りして独自undoに委譲
      // contenteditableへのネイティブundoはQuill内部状態と食い違いDOM破壊の原因になる
      try {
        q.root.addEventListener('beforeinput', (e) => {
          if (e.inputType !== 'historyUndo' && e.inputType !== 'historyRedo') return;
          const t = e.target;
          if (t instanceof HTMLElement && t.closest && t.closest('textarea, input')) return;  // ウィジェット内フォームは素通し
          e.preventDefault();
          e.stopPropagation();
          if (e.inputType === 'historyUndo') { if (q.__trpgUndo) q.__trpgUndo(); }
          else { if (q.__trpgRedo) q.__trpgRedo(); }
        }, true);
      } catch {}

      // フォーカスを外した時点で保留分を確定（シーン切替時の取りこぼし防止）
      try {
        q.root.addEventListener('blur', () => { if (!_isComposing) flushSnapshot(); }, true);
      } catch {}
    }

    if (!isView) {
      const toolbar = q.getModule('toolbar');

      // ★ モバイル折りたたみ：最初のql-formatsグループのみ常時表示、残りは「⋯」に格納
      try {
        const tbEl = toolbar.container;
        if (tbEl) {
          const groups = tbEl.querySelectorAll('.ql-formats');
          groups.forEach((g, i) => {
            if (i >= 1) g.classList.add('tb-extra');
          });
          // トグルボタンを最初のグループの直後に配置
          const toggleBtn = document.createElement('button');
          toggleBtn.type = 'button';
          toggleBtn.className = 'tb-toggle-btn';
          toggleBtn.textContent = '⋯';
          toggleBtn.title = 'メニューを展開';
          toggleBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const extras = tbEl.querySelectorAll('.tb-extra');
            const isShown = extras[0] && extras[0].classList.contains('tb-show');
            extras.forEach(g => g.classList.toggle('tb-show', !isShown));
            toggleBtn.textContent = isShown ? '⋯' : '✕';
          });
          const firstGroup = tbEl.querySelector('.ql-formats');
          if (firstGroup && firstGroup.nextSibling) {
            tbEl.insertBefore(toggleBtn, firstGroup.nextSibling);
          } else {
            tbEl.appendChild(toggleBtn);
          }
        }
      } catch {}

      // 画像ボタン
      toolbar.addHandler('image', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.multiple = true;
        input.click();
        input.onchange = async () => {
          const images = await readFiles(input.files);
          if (!images.length) return;

          const range = q.getSelection(true) || { index: q.getLength() };
          const idx = Math.max(0, range.index);

          // If the caret is on/near an existing gallery embed, append into that gallery instead of creating a new one.
          const findGalleryAt = (i) => {
            try {
              const [leaf] = q.getLeaf(i);
              if (!leaf) return null;
              // leaf can be the gallery blot itself or something inside/around it
              const domNode = leaf.domNode;
              const galleryNode = domNode && domNode.closest ? domNode.closest('.img-gallery') : null;
              if (galleryNode) return galleryNode;
            } catch {}
            return null;
          };

          let galleryNode = findGalleryAt(idx) || findGalleryAt(Math.max(0, idx - 1)) || findGalleryAt(Math.min(q.getLength() - 1, idx + 1));

          // Also consider the previous line embed if caret is just after the gallery
          if (!galleryNode) {
            try {
              const [prevLeaf] = q.getLeaf(Math.max(0, idx - 2));
              const prevNode = prevLeaf?.domNode;
              const gn = prevNode && prevNode.closest ? prevNode.closest('.img-gallery') : null;
              if (gn) galleryNode = gn;
            } catch {}
          }

          if (galleryNode) {
            // Append
            let current = [];
            try { current = JSON.parse(galleryNode.dataset.images || "[]"); } catch { current = []; }
            const merged = current.concat(images);
            galleryNode.dataset.images = JSON.stringify(merged);

            const grid = galleryNode.querySelector('.gallery-grid');
            if (grid) {
              ImgGalleryBlot.renderImages(grid, merged);
              // Re-init sortable to ensure handlers are attached to new items
              ImgGalleryBlot.initSortable(grid, galleryNode);
            }
            galleryNode.dispatchEvent(new Event("gallery-changed", { bubbles: true }));
            return;
          }

          // Otherwise create a new gallery embed
          q.insertEmbed(idx, 'imgGallery', { images }, 'user');
          q.insertText(idx + 1, '\n', 'silent');
          q.setSelection(idx + 2, 0, 'silent');
        };
      });

// コピー箱ボタン
      toolbar.addHandler('copybox', () => {
        const range = q.getSelection(true);
        if (!range) return;

        // 既にコピー箱内なら（選択なし時）は何もしない
        let inCopybox = false;
        try {
          const linePair = q.getLine(range.index);
          const line = linePair && linePair[0] ? linePair[0] : null;
          const dom = line && line.domNode ? line.domNode : null;

function setupViewCopyHandler() {
    if (window.__trpg_view_copy_handler_installed) return;
    window.__trpg_view_copy_handler_installed = true;

    // View mode: allow editing scene status via <select>
    dom.paperView.addEventListener('change', (e) => {
      const sel = e.target;
      if (!sel || !(sel instanceof HTMLElement)) return;
      if (!sel.classList.contains('scene-status-select')) return;
      const sceneId = sel.getAttribute('data-scene-id');
      if (!sceneId) return;

      const s = getCurrentScenario();
      if (!s) return;
      normalizeScenarioData(s);

      let found = null;
      for (const ch of (s.chapters || [])) {
        const sc = (ch.scenes || []).find(x => x.id === sceneId);
        if (sc) { found = sc; break; }
      }
      if (!found) return;

      const next = String(sel.value || "unused");
      if (!SCENE_STATUS[next]) return;
      found.status = next;
      s.updatedAt = Date.now();
      saveApp();

      // Re-render to reflect filtering (e.g., hide "used")
      renderEditor();
    }, true);

    // Delegate on the whole paper area (re-render safe)
    dom.paperView.addEventListener('click', async (e) => {
      // 1タップ「完了」：シーンを使用済みにして隠す
      const doneBtn = e.target.closest && e.target.closest('.scene-done-btn');
      if (doneBtn) {
        e.preventDefault(); e.stopPropagation();
        const sceneId = doneBtn.getAttribute('data-scene-done');
        const s = getCurrentScenario();
        if (!s || !sceneId) return;
        normalizeScenarioData(s);
        for (const ch of (s.chapters || [])) {
          const sc = (ch.scenes || []).find(x => x.id === sceneId);
          if (sc) { sc.status = "used"; break; }
        }
        s.updatedAt = Date.now();
        saveApp();
        renderEditor();
        try { showToast("使用済みにしました"); } catch {}
        return;
      }

      // 1タップ「スキップ」：シーンをスキップにして隠す
      const skipBtn = e.target.closest && e.target.closest('.scene-skip-btn');
      if (skipBtn) {
        e.preventDefault(); e.stopPropagation();
        const sceneId = skipBtn.getAttribute('data-scene-skip');
        const s = getCurrentScenario();
        if (!s || !sceneId) return;
        normalizeScenarioData(s);
        for (const ch of (s.chapters || [])) {
          const sc = (ch.scenes || []).find(x => x.id === sceneId);
          if (sc) { sc.status = "skipped"; break; }
        }
        s.updatedAt = Date.now();
        saveApp();
        renderEditor();
        try { showToast("スキップにしました"); } catch {}
        return;
      }

      // Image click (view mode): open modal with original size
      const item = e.target.closest && e.target.closest('.view-content .img-gallery .gallery-item');
      if (item) {
        e.preventDefault();
        e.stopPropagation();
        const innerImg = item.querySelector('img');
        if (innerImg) {
          openImageModal(innerImg.getAttribute('src') || innerImg.src);
        }
        return;
      }

      // Skill check widget copy (view mode)
      const skillBtn = e.target.closest && e.target.closest('.skill-copy-btn');
      if (skillBtn) {
        if (!skillBtn.closest('.view-content')) return;
        e.preventDefault(); e.stopPropagation();

        const widget = skillBtn.closest('.skill-check-widget');
        if (!widget) return;

        const kind = String(skillBtn.dataset.result || '');
        let raw = '';

        // Prefer the rendered view text within the same column
        const col = skillBtn.closest('.skill-check-col');
        if (col) {
          const viewText = col.querySelector('.skill-text-view');
          if (viewText) raw = String(viewText.innerText || viewText.textContent || '');
        }

        // Fallback to dataset.payload (matches safeHTMLForView normalization)
        if (!raw) {
          let payload = null;
          try { payload = JSON.parse(widget.dataset.payload || '{}'); } catch { payload = {}; }
          if (kind === 'success') raw = String(payload.success || '');
          else if (kind === 'failure') raw = String(payload.failure || '');
        }

        // Last resort: original textarea/input content (if any)
        if (!raw) {
          const ta = widget.querySelector('.skill-textarea[data-result="' + kind + '"]');
          if (ta) raw = String(ta.value || ta.textContent || '');
        }

        const txt = String(raw || '').replace(/\s+$/,'');
        if (!txt) { showToast("コピーするテキストが空です"); return; }

        const ok = await copyTextToClipboard(txt);
        if (ok) {
          if (col) {
            col.classList.add('skill-flash');
            setTimeout(() => { try { col.classList.remove('skill-flash'); } catch {} }, 450);
          }
          showToast("コピーしました！");
        } else {
          showToast("コピーに失敗しました（ブラウザ設定をご確認ください）");
        }
        return;
      }

      // KPメモ copy (view mode)
      const kpCopyBtn = e.target.closest && e.target.closest('.kp-note-btn.copy');
      if (kpCopyBtn) {
        if (!kpCopyBtn.closest('.view-content')) return;
        e.preventDefault(); e.stopPropagation();

        const note = kpCopyBtn.closest('.kp-note');
        if (!note) return;

        let raw = '';
        const viewText = note.querySelector('.kp-note-view-text');
        if (viewText) raw = String(viewText.innerText || viewText.textContent || '');

        if (!raw) {
          let payload = null;
          try { payload = JSON.parse(note.dataset.payload || '{}'); } catch { payload = {}; }
          raw = String(payload.text || '');
        }

        const txt = String(raw || '').replace(/\s+$/,'');
        if (!txt) { showToast("コピーするテキストが空です"); return; }

        const ok = await copyTextToClipboard(txt);
        showToast(ok ? "コピーしました！" : "コピーに失敗しました（ブラウザ設定をご確認ください）");
        return;
      }

      // ccfolia-line click (view mode): 同名の連続ccfolia-lineを全てまとめてコピー
      const ccfLine = e.target.closest('.ccfolia-line');
      if (ccfLine && ccfLine.closest('.view-content')) {
        e.preventDefault(); e.stopPropagation();
        const name = ccfLine.getAttribute('data-ccfolia-name') || '';
        // 同名で連続するccfolia-lineを全て集める
        let lines = [];
        let el = ccfLine;
        // まず先頭まで遡る
        while (el.previousElementSibling && el.previousElementSibling.classList.contains('ccfolia-line') &&
               el.previousElementSibling.getAttribute('data-ccfolia-name') === name) {
          el = el.previousElementSibling;
        }
        // 先頭から順にテキスト収集
        while (el && el.classList.contains('ccfolia-line') && el.getAttribute('data-ccfolia-name') === name) {
          lines.push(String(el.textContent || '').replace(/\s+$/, ''));
          el = el.nextElementSibling;
        }
        const text = lines.join('\n').replace(/\n+$/, '');
        if (!text) return;
        const ok = await copyTextToClipboard(text);
        if (ok) {
          ccfLine.style.transition = 'background .15s';
          ccfLine.style.background = 'rgba(156,163,175,0.15)';
          setTimeout(() => { ccfLine.style.background = ''; }, 400);
          showToast("コピーしました！");
        } else {
          showToast("コピーに失敗しました（ブラウザ設定をご確認ください）");
        }
        return;
      }

      // Copy-box click (view mode)
      const box = e.target.closest('.copy-box');
      if (!box) return;

      // Ensure we are in view mode area
      if (!box.closest('.view-content')) return;

      // 隣接する copy-box（＝見た目上ひとつのボックス）をまとめて対象にする
      const group = [box];
      let prev = box.previousElementSibling;
      while (prev && prev.classList && prev.classList.contains('copy-box')) { group.unshift(prev); prev = prev.previousElementSibling; }
      let next = box.nextElementSibling;
      while (next && next.classList && next.classList.contains('copy-box')) { group.push(next); next = next.nextElementSibling; }

      const parts = group.map(el => {
        const clone = el.cloneNode(true);
        clone.querySelectorAll('.copybox-remove').forEach(n => n.remove());
        clone.querySelectorAll('br').forEach(br => br.replaceWith(document.createTextNode('\n')));
        return String(clone.textContent || '').replace(/[ \t]+$/, '');
      });
      const text = parts.join('\n').replace(/\n+$/, '');
      if (!text) return;

      const ok = await copyTextToClipboard(text);
      if (ok) {
        group.forEach(el => {
          el.classList.add('copy-flash');
          setTimeout(() => el.classList.remove('copy-flash'), 450);
        });
        showToast("コピーしました！");
      } else {
        showToast("コピーに失敗しました（ブラウザ設定をご確認ください）");
      }
    }, true);
  }

          if (domOrder.length !== visibleCount) { renderHome(); return; }
          // 非表示シナリオは元の位置に固定し、表示中のものだけ並べ替える

  // 詳細表示の一覧を1枚の画像（PNG）として書き出す（募集先に貼る用）
  function loadImageMaybe(src) {
    return new Promise((resolve) => {
      if (!src) { resolve(null); return; }
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = src;
    });
  }

  function wrapTextLines(ctx, text, maxWidth, maxLines) {
    const out = [];
    const paragraphs = String(text || "").split("\n");
    for (const para of paragraphs) {
      if (para === "") { out.push(""); if (maxLines && out.length >= maxLines) break; continue; }
      let line = "";
      for (const chr of para) {
        const test = line + chr;
        if (ctx.measureText(test).width > maxWidth && line) {
          out.push(line);
          line = chr;
          if (maxLines && out.length >= maxLines) break;
        } else {
          line = test;
        }
      }
      if (maxLines && out.length >= maxLines) break;
      out.push(line);
      if (maxLines && out.length >= maxLines) break;
    }
    if (maxLines && out.length > maxLines) out.length = maxLines;
    return out;
  }

  function roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  async function exportListAsImage() {
    const items = app.scenarios.filter(s => !s.hideFromDetail);
    if (!items.length) { try { showToast("出力できるシナリオがありません"); } catch {} return; }
    try { showToast("画像を生成中…"); } catch {}

    const covers = await Promise.all(items.map(s => loadImageMaybe(s.coverImage)));

    // レイアウト定数（詳細表示と同じ縦型カードをグリッド配置）
    const cols = Math.max(1, Math.min(4, items.length));
    const cardW = 380;
    const gap = 20;
    const pad = 28;
    const headerH = 0;
    const coverH = 180;
    const cardPad = 16;
    const radius = 14;
    const synPad = 11;
    const W = pad * 2 + cols * cardW + (cols - 1) * gap;
    const innerW = cardW - cardPad * 2;

    const titleFont = "700 16px 'Hiragino Sans','Yu Gothic',sans-serif";
    const chipFont = "600 12px 'Hiragino Sans','Yu Gothic',sans-serif";
    const synFont = "13px 'Hiragino Sans','Yu Gothic',sans-serif";
    const titleLH = 22, synLH = 21, chipH = 23, chipGap = 6, lineGap = 6;
    const chipLineH = 15, chipPadY = 4;

    const meas = document.createElement("canvas").getContext("2d");

    const buildChips = (s) => {
      const c = [];
      if (s.author) c.push({ t: "作者: " + s.author, kind: "author" });
      if (s.players) c.push({ t: "人数: " + s.players });
      if (s.playTime) c.push({ t: "⏱ " + s.playTime });
      if (s.lost) c.push({ t: "ロスト: " + s.lost, kind: /あり/.test(s.lost) ? "danger" : "" });
      if (s.setting) c.push({ t: "舞台: " + s.setting });
      return c;
    };

    // 各カードの内容を事前計算
    const layouts = items.map((s) => {
      meas.font = titleFont;
      const titleLines = wrapTextLines(meas, s.title || "（無題）", innerW, 2);
      meas.font = chipFont;
      const chips = buildChips(s).map(ch => {
        const single = Math.ceil(meas.measureText(ch.t).width) + 18;
        if (single <= innerW) return { kind: ch.kind, lines: [ch.t], w: single, h: chipLineH + chipPadY * 2 };
        const lines = wrapTextLines(meas, ch.t, innerW - 18, 3);
        return { kind: ch.kind, lines, w: innerW, h: lines.length * chipLineH + chipPadY * 2 };
      });
      const chipRows = [];
      let row = [], rowW = 0;
      for (const ch of chips) {
        if (row.length && rowW + ch.w + chipGap > innerW) { chipRows.push(row); row = []; rowW = 0; }
        row.push(ch); rowW += ch.w + chipGap;
      }
      if (row.length) chipRows.push(row);
      meas.font = synFont;
      const synEmpty = !s.synopsis;
      const synLines = wrapTextLines(meas, synEmpty ? "あらすじ未記入" : s.synopsis, innerW - synPad * 2, 6);
      const titleH = titleLines.length * titleLH;
      const chipsH = chipRows.reduce((a, r) => a + Math.max(...r.map(c => c.h)) + lineGap, 0);
      const synBoxH = synLines.length * synLH + synPad * 2;
      return { titleLines, chipRows, synLines, synEmpty, titleH, chipsH, synBoxH };
    });

    // 行グリッド配置（同じ行はタイトル・情報・あらすじ欄の高さを揃える）
    const place = new Array(layouts.length);
    let gy = pad + headerH;
    for (let i = 0; i < layouts.length; i += cols) {
      const row = layouts.slice(i, i + cols);
      const rowTitleH = Math.max(...row.map(L => L.titleH));
      const rowChipsH = Math.max(...row.map(L => L.chipsH));
      const rowSynH = Math.max(...row.map(L => L.synBoxH));
      const rowH = coverH + cardPad + rowTitleH + 6 + rowChipsH + 8 + rowSynH + cardPad;
      row.forEach((L, ci) => {
        place[i + ci] = { x: pad + ci * (cardW + gap), y: gy, rowH, rowTitleH, rowChipsH, rowSynH };
      });
      gy += rowH + gap;
    }
    const totalH = gy - gap + pad;

    const scale = Math.min(window.devicePixelRatio || 1, 2) * 1.5;
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(W * scale);
    canvas.height = Math.round(totalH * scale);
    const ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);
    ctx.textBaseline = "top";

    // 背景
    ctx.fillStyle = "#f5f5f7";
    ctx.fillRect(0, 0, W, totalH);

    for (let i = 0; i < layouts.length; i++) {
      const L = layouts[i];
      const { x, y, rowH, rowTitleH, rowChipsH, rowSynH } = place[i];
      const cardH = rowH;

      // カード影＋白背景
      ctx.save();
      ctx.shadowColor = "rgba(19,36,64,0.10)";
      ctx.shadowBlur = 12;
      ctx.shadowOffsetY = 3;
      roundRectPath(ctx, x, y, cardW, cardH, radius);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
      ctx.restore();

      // カバー（上部・object-fit: cover）
      ctx.save();
      roundRectPath(ctx, x, y, cardW, cardH, radius);
      ctx.clip();
      const img = covers[i];
      if (img && img.width && img.height) {
        const ar = img.width / img.height, box = cardW / coverH;
        let sw, sh, sx, sy;
        if (ar > box) { sh = img.height; sw = sh * box; sx = (img.width - sw) / 2; sy = 0; }
        else { sw = img.width; sh = sw / box; sx = 0; sy = (img.height - sh) / 2; }
        ctx.drawImage(img, sx, sy, sw, sh, x, y, cardW, coverH);
      } else {
        ctx.fillStyle = "#eef0f4"; ctx.fillRect(x, y, cardW, coverH);
        ctx.fillStyle = "#9aa3b2"; ctx.font = "40px sans-serif"; ctx.textAlign = "center";
        ctx.fillText("📖", x + cardW / 2, y + coverH / 2 - 26);
        ctx.textAlign = "left";
      }
      ctx.restore();

      // 枠線
      ctx.strokeStyle = "rgba(26,26,46,0.10)";
      ctx.lineWidth = 1;
      roundRectPath(ctx, x + 0.5, y + 0.5, cardW - 1, cardH - 1, radius);
      ctx.stroke();

      const bx = x + cardPad;
      const titleTop = y + coverH + cardPad;
      const chipsTop = titleTop + rowTitleH + 6;
      const synTop = chipsTop + rowChipsH + 8;

      // タイトル
      ctx.fillStyle = "#1a1a2e";
      ctx.font = titleFont;
      let ty = titleTop;
      for (const ln of L.titleLines) { ctx.fillText(ln, bx, ty); ty += titleLH; }

      // 情報チップ
      ctx.font = chipFont;
      let by = chipsTop;
      for (const r of L.chipRows) {
        const rowMaxH = Math.max(...r.map(c => c.h));
        let chx = bx;
        for (const ch of r) {
          if (ch.kind === "danger") ctx.fillStyle = "#fbe3e3";
          else if (ch.kind === "author") ctx.fillStyle = "#2b4a73";
          else ctx.fillStyle = "#e6f4f1";
          roundRectPath(ctx, chx, by, ch.w, ch.h, Math.min(ch.h / 2, 11));
          ctx.fill();
          ctx.fillStyle = ch.kind === "danger" ? "#c01818" : (ch.kind === "author" ? "#ffffff" : "#374151");
          let cty = by + chipPadY;
          for (const ln of ch.lines) { ctx.fillText(ln, chx + 9, cty); cty += chipLineH; }
          chx += ch.w + chipGap;
        }
        by += rowMaxH + lineGap;
      }

      // あらすじ（枠付きボックス・行内で高さを揃える）
      ctx.fillStyle = "#f6f5f3";
      roundRectPath(ctx, bx, synTop, innerW, rowSynH, 8);
      ctx.fill();
      ctx.strokeStyle = "rgba(19,36,64,0.10)";
      ctx.lineWidth = 1;
      roundRectPath(ctx, bx + 0.5, synTop + 0.5, innerW - 1, rowSynH - 1, 8);
      ctx.stroke();
      ctx.fillStyle = L.synEmpty ? "#9aa0a6" : "#374151";
      ctx.font = L.synEmpty ? ("italic " + synFont) : synFont;
      let sty = synTop + synPad;
      for (const ln of L.synLines) { ctx.fillText(ln, bx + synPad, sty); sty += synLH; }
    }

    canvas.toBlob((blob) => {
      if (!blob) { try { showToast("画像の生成に失敗しました"); } catch {} return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "scenario-list.png";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      try { showToast("画像を保存しました"); } catch {}
    }, "image/png");
  }

  // エディタ画面 (編集モード)
  function renderEditor() {
    const s = getCurrentScenario();
    if (!s) return renderHome();

    // このシナリオが使う画像を取り寄せ、届いたら表示を差し替える
    try {
      ensureImagesForScenario(s)
        .then(() => { refreshRenderedImages(); })
        .catch(err => { try { console.warn("image load failed:", err); } catch {} });
    } catch {}

    try { const eh = document.getElementById("editorHeader"); if (eh) eh.classList.remove("toolbar-collapsed"); } catch {}
    try { if (dom.btnBackHome) dom.btnBackHome.style.display = ""; } catch {}
    normalizeScenarioData(s);
// UI切り替え
    dom.homeView.classList.add("hidden");
    dom.editorView.classList.remove("hidden");
    dom.homeMenu.classList.add("hidden");
    dom.editorMenu.classList.remove("hidden");
    dom.btnNew.classList.add("hidden"); // エディタ中は新規ボタン隠す

    // モード判定
    const isView = (s.mode === "view");

    // 章ページの初期化（URLハッシュ優先 → それ以外は先頭章）
    const activeChapterId = ensureCurrentChapter(s);
    if (activeChapterId) {
      // エディタを開いたときに現在章をURLに反映（ブラウザの戻る/進むにも対応しやすくする）
      if (!location.hash || parseChapterIdFromHash() !== activeChapterId) {
        setHashChapter(activeChapterId, { push: false });
      }
    }

dom.scenarioTitle.value = s.title;
    dom.scenarioTitle.disabled = isView;
    dom.btnToggleMode.textContent = isView
      ? (isMobileLayout() ? "編集" : "編集モードに戻る")
      : (isMobileLayout() ? "プレイ" : "閲覧モード（プレイ）");
    dom.btnToggleMode.classList.toggle("mode-to-play", !isView);
    dom.btnToggleMode.classList.toggle("mode-to-edit", isView);

    dom.btnAddChapter.classList.toggle("hidden", isView);

    // 表紙プレビュー更新
    try {
      const wrap = document.getElementById("coverPreviewWrap");
      const btnRemove = document.getElementById("btnRemoveCover");
      if (wrap) {
        if (s.coverImage) {
          wrap.innerHTML = `<img class="cover-preview" src="${s.coverImage}" alt="表紙"/>`;
          if (btnRemove) btnRemove.style.display = "";
        } else {
          wrap.innerHTML = `<div class="cover-placeholder">未設定</div>`;
          if (btnRemove) btnRemove.style.display = "none";
        }
      }
    } catch {}

    // 探索者設定の更新
    try {
      const pcSettingsEl = document.getElementById("pcSettings");
      const pcListEl = document.getElementById("pcList");
      if (pcSettingsEl && pcListEl) {
        pcSettingsEl.style.display = "";
        if (!s.explorers) s.explorers = [];
        renderPcList(s);
      }
    } catch {}

    // シナリオ情報の更新
    try {
      const infoEl = document.getElementById("scenarioInfo");
      if (infoEl) { infoEl.style.display = ""; renderScenarioInfo(s); }
    } catch {}

    dom.nav.innerHTML = ""; // 目次リセット

    if (isView) {
      renderViewMode(s);
    } else {
      renderEditMode(s);
    }
    try { updateCharCount(); } catch {}
    // モード切替後にマージンメモを再描画＆位置同期（レイアウト確定を待つ）
    try {
      if (document.body.classList.contains("kp-panel-open")) {
        setTimeout(() => { try { renderKpPanel(); } catch {} }, 30);
        setTimeout(() => { try { scheduleKpPanelSync(); } catch {} }, 150);
        setTimeout(() => { try { scheduleKpPanelSync(); } catch {} }, 400);
        setTimeout(() => { try { scheduleKpPanelSync(); } catch {} }, 800);
        setTimeout(() => { try { scheduleKpPanelSync(); } catch {} }, 1500);
        // 画像ロード完了後に再同期
        try {
          const container = isView ? document.getElementById("paperContent") : document.getElementById("chapters");
          if (container) {
            container.querySelectorAll("img").forEach(img => {
              if (!img.complete) {
                img.addEventListener("load", () => { try { scheduleKpPanelSync(); } catch {} }, { once: true });
                img.addEventListener("error", () => { try { scheduleKpPanelSync(); } catch {} }, { once: true });
              }
            });
          }
        } catch {}
      }
    } catch {}
  }

  // 編集モード描画
  function renderEditMode(s) {
    dom.editorBodyContainer.classList.remove("hidden");
    dom.paperView.classList.add("hidden");
    try { dom.btnBackToEditFloating.classList.add("hidden"); } catch {}
    dom.editorHeader.classList.remove("hidden");
    dom.chapters.innerHTML = "";
    dom.nav.innerHTML = "";

    const activeChapterId = ensureCurrentChapter(s);
    if (!activeChapterId) return;

    let rendered = false;

    s.chapters.forEach(ch => {
      // 章ナビ（非表示章は章タイトルのみ）
      const navItem = document.createElement("div");
      navItem.className = "nav-item nav-chapter" + (ch.id === activeChapterId ? " active" : "");
      navItem.dataset.chapterId = ch.id;
      navItem.title = ch.title;
      const chHandle = document.createElement("span");
      chHandle.className = "chapter-drag-handle";
      chHandle.textContent = "⠿";
      chHandle.title = "ドラッグで章を並び替え";
      const chLabel = document.createElement("span");
      chLabel.className = "nav-chapter-label";
      chLabel.textContent = ch.title;
      navItem.appendChild(chHandle);
      navItem.appendChild(chLabel);
      navItem.onclick = (e) => { if (e.target === chHandle) return; setCurrentChapter(s, ch.id); if (isMobileLayout()) closeMobileMenu(); };
      dom.nav.appendChild(navItem);

      // アクティブ章のシーンは「章タイトル直下」にまとめて表示するためのコンテナを用意
      // （シーン追加時もここへ追記することで、章一覧の末尾に紛れない）
      let activeScenesNav = null;
      if (ch.id === activeChapterId) {
        activeScenesNav = document.createElement("div");
        activeScenesNav.className = "nav-scenes";
        activeScenesNav.dataset.chapterId = ch.id;
        dom.nav.appendChild(activeScenesNav);
      }

      if (ch.id !== activeChapterId) return;

      // 章ブロック（表示中の章のみ）
      const chBlock = document.createElement("div");
      chBlock.className = "chapter-block";
      chBlock.id = `ch-${ch.id}`;

      const header = document.createElement("div");
      header.className = "chapter-header";

      const headerLeft = document.createElement("div");
      headerLeft.style.flex = "1";
      headerLeft.style.minWidth = "0";

      const headerRight = document.createElement("div");
      headerRight.style.display = "flex";
      headerRight.style.gap = "8px";
      headerRight.style.alignItems = "center";

      const titleInput = document.createElement("input");
      titleInput.className = "chapter-title-input";
      titleInput.value = ch.title;
      titleInput.placeholder = "章タイトル";
      titleInput.oninput = (e) => {
        ch.title = e.target.value;
        chLabel.textContent = e.target.value || "章タイトル";
        navItem.title = e.target.value || "章タイトル";
        s.updatedAt = Date.now();
        __hasDirtyChanges = true;
      };

      // 章削除ボタン
      const delChapterBtn = document.createElement("button");
      delChapterBtn.className = "danger";
      delChapterBtn.textContent = "章を削除";
      delChapterBtn.onclick = () => {
        if ((s.chapters || []).length <= 1) {
          alert("最後の章は削除できません。代わりに章タイトルを変更してください。");
          return;
        }
        if (!confirm("この章を削除しますか？（章内のシーンもすべて削除されます）")) return;

        const idx = s.chapters.findIndex(x => x.id === ch.id);
        if (idx === -1) return;

        s.chapters.splice(idx, 1);

        // 現在章を削除した場合は、隣の章へ自動的に移動
        if (s.currentChapterId === ch.id) {
          const next = s.chapters[idx] || s.chapters[idx - 1] || s.chapters[0] || null;
          s.currentChapterId = next ? next.id : null;
          if (s.currentChapterId) setHashChapter(s.currentChapterId, { push: false });
        }

        s.updatedAt = Date.now();
        saveApp();
        renderEditor();
      };

      headerLeft.appendChild(titleInput);

      // 章を複製ボタン
      const dupChapterBtn = document.createElement("button");
      dupChapterBtn.className = "ghost ch-dup";
      dupChapterBtn.textContent = "複製";
      dupChapterBtn.title = "この章をコピーして新しい章を作成";
      dupChapterBtn.onclick = () => { duplicateChapter(s, ch.id); };

      headerRight.appendChild(dupChapterBtn);
      headerRight.appendChild(delChapterBtn);
      header.appendChild(headerLeft);
      header.appendChild(headerRight);
      chBlock.appendChild(header);

      // シーンコンテナ
      const scenesDiv = document.createElement("div");

      // シーン並び替え
      new Sortable(scenesDiv, {
        handle: ".scene-drag-handle",
        animation: 150,
        onEnd: (evt) => {
          const item = ch.scenes.splice(evt.oldIndex, 1)[0];
          ch.scenes.splice(evt.newIndex, 0, item);
          s.updatedAt = Date.now();
          saveApp();
          captureScroll();
          renderEditor();
          restoreScroll();
        }
      });

            const appendSceneBlock = (sc) => {
        // 目次（表示中の章のシーンのみ）
        const sceneIndex = activeScenesNav ? activeScenesNav.querySelectorAll('.nav-item.sub').length + 1 : 1;
        const subNav = document.createElement("div");
        subNav.className = "nav-item sub";
        subNav.dataset.num = sceneIndex;
        subNav.title = sc.title;
        const label = document.createElement("span");
        label.className = "nav-label";
        label.textContent = sc.title;
        subNav.appendChild(label);
        subNav.onclick = () => document.getElementById(`sc-${sc.id}`)?.scrollIntoView({ behavior: "smooth" });
        activeScenesNav?.appendChild(subNav);

        const scBlock = document.createElement("div");
        scBlock.className = "scene-block";
        scBlock.id = `sc-${sc.id}`;
        scBlock.dataset.sceneId = sc.id;
        scBlock.dataset.chapterId = ch.id;
        scBlock.addEventListener("pointerdown", () => {
          setActiveKpContext(sc.id, ch.id);
          document.querySelectorAll('.scene-block.scene-active').forEach(el => el.classList.remove('scene-active'));
          scBlock.classList.add('scene-active');
        }, true);
        scBlock.addEventListener("focusin", () => {
          setActiveKpContext(sc.id, ch.id);
          document.querySelectorAll('.scene-block.scene-active').forEach(el => el.classList.remove('scene-active'));
          scBlock.classList.add('scene-active');
        }, true);

        const scHead = document.createElement("div");
        scHead.className = "scene-header";
        scHead.innerHTML = `<span class="scene-drag-handle">⠿</span>`;

        const scInput = document.createElement("input");
        scInput.type = "text";
        scInput.className = "scene-title-input";
        scInput.value = sc.title;
        scInput.placeholder = "シーンタイトル";
        scInput.oninput = (e) => {
          sc.title = e.target.value;
          subNav.textContent = e.target.value || "シーンタイトル";
          s.updatedAt = Date.now();
          __hasDirtyChanges = true;
        };

        // status/tags defaults
        if (!SCENE_STATUS[sc.status]) sc.status = "unused";
        if (!Array.isArray(sc.tags)) sc.tags = [];

        const metaRow = document.createElement("div");
        metaRow.className = "scene-meta-row";

        const statusSelect = document.createElement("select");
        statusSelect.className = "scene-status-select";
        statusSelect.innerHTML = `
          <option value="unused">未使用</option>
          <option value="used">使用済</option>
          <option value="skipped">スキップ</option>        `;
        statusSelect.value = sc.status;
        statusSelect.onchange = (e) => {
          sc.status = e.target.value;
          s.updatedAt = Date.now();
          __hasDirtyChanges = true;
        };

        const tagsInput = document.createElement("input");
        tagsInput.type = "text";
        tagsInput.className = "scene-tags-input";
        tagsInput.placeholder = "タグ（カンマ区切り）";
        tagsInput.value = (sc.tags || []).join(", ");
        tagsInput.oninput = (e) => {
          const raw = String(e.target.value || "");
          sc.tags = raw.split(",").map(t => t.trim()).filter(Boolean).slice(0, 30);
          renderTagChips();
          s.updatedAt = Date.now();
          __hasDirtyChanges = true;
        };

        const chips = document.createElement("div");
        chips.style.display = "flex";
        chips.style.gap = "6px";
        chips.style.flexWrap = "wrap";
        chips.style.marginLeft = "4px";

        function renderTagChips() {
          chips.innerHTML = "";
          (sc.tags || []).slice(0, 6).forEach(t => {
            const chip = document.createElement("span");
            chip.className = "tag-chip";
            chip.textContent = t;
            chips.appendChild(chip);
          });
        }
        renderTagChips();

        metaRow.appendChild(statusSelect);
        metaRow.appendChild(tagsInput);
        metaRow.appendChild(chips);

        const delBtn = document.createElement("button");
        delBtn.className = "scene-delete-btn";
        delBtn.textContent = "×";
        delBtn.onclick = () => {
          if (confirm("シーンを削除しますか？")) {
            // スクロールが飛ばないように、全体再描画はせず差分で削除する
            const idx = ch.scenes.findIndex(x => x.id === sc.id);
            if (idx !== -1) ch.scenes.splice(idx, 1);
            s.updatedAt = Date.now();
            saveApp();

            // 目次から削除
            try { subNav.remove(); } catch {}
            // DOMから削除
            try { scBlock.remove(); } catch {}
          }
        };

        // Order: drag handle -> collapse -> title -> meta (right)
        const collapseBtn = document.createElement("button");
        collapseBtn.type = "button";
        collapseBtn.className = "scene-collapse-btn" + (__sceneCollapsed.has(sc.id) ? " collapsed" : "");
        collapseBtn.textContent = "▾";
        collapseBtn.title = "シーンを折りたたむ/展開する";
        collapseBtn.onclick = (e) => { e.stopPropagation(); toggleSceneCollapse(sc.id); };

        scHead.appendChild(collapseBtn);
        scHead.appendChild(scInput);
        scHead.appendChild(metaRow);
        scHead.appendChild(delBtn);
        scBlock.appendChild(scHead);

        const bodyWrap = document.createElement("div");
        bodyWrap.className = "scene-body-wrap" + (__sceneCollapsed.has(sc.id) ? " collapsed" : "");

        const editorArea = document.createElement("div");
        bodyWrap.appendChild(editorArea);

        scBlock.appendChild(bodyWrap);

        // 折りたたまれていなければQuillを初期化
        if (!__sceneCollapsed.has(sc.id)) {
          createQuill(editorArea, sc.body, false, (html) => {
            sc.body = html;
            s.updatedAt = Date.now();
            __hasDirtyChanges = true;
          });
        }

        scenesDiv.appendChild(scBlock);
      };

      ch.scenes.forEach(sc => appendSceneBlock(sc));

      // 最初のシーンをアクティブにする（ツールバー表示のため）
      try {
        const firstScene = scenesDiv.querySelector('.scene-block');
        if (firstScene) firstScene.classList.add('scene-active');
      } catch {}


      // シーン追加ボタン
      const footer = document.createElement("div");
      footer.style.padding = "10px";
      const addBtn = document.createElement("button");
      addBtn.textContent = "＋ シーン追加";
      addBtn.style.width = "100%";
      addBtn.onclick = () => {
        // 根本対策：シーン追加でエディタ全体を再描画しない（scrollTopを触らない）
        const sc = { id: generateId(), title: "新規シーン", body: "", status: "unused", tags: [] };
        ch.scenes.push(sc);
        s.updatedAt = Date.now();
        saveApp();

        // 追加分だけDOM生成して末尾に足す（現在のスクロール位置はそのまま維持）
        appendSceneBlock(sc);
      };
      footer.appendChild(addBtn);

      chBlock.appendChild(scenesDiv);
      chBlock.appendChild(footer);
      dom.chapters.appendChild(chBlock);

      rendered = true;
    });

    if (!rendered) {
      // 念のため：章が存在するのに描画されない場合は先頭章に戻す
      s.currentChapterId = s.chapters[0]?.id || null;
      saveApp();
      renderEditor();
    }

    // 章の並び替え（サイドバー目次でD&D）
    try {
      if (dom.nav.__chSortable) { try { dom.nav.__chSortable.destroy(); } catch {} }
      dom.nav.__chSortable = new Sortable(dom.nav, {
        draggable: ".nav-chapter",
        handle: ".chapter-drag-handle",
        animation: 150,
        onEnd: () => {
          const order = Array.from(dom.nav.querySelectorAll(".nav-chapter"))
            .map(el => el.dataset.chapterId)
            .filter(Boolean);
          if (order.length !== s.chapters.length) { renderEditor(); return; }
          const byId = {};
          s.chapters.forEach(c => { byId[c.id] = c; });
          const reordered = order.map(id => byId[id]).filter(Boolean);
          if (reordered.length === s.chapters.length) {
            s.chapters = reordered;
            s.updatedAt = Date.now();
            __hasDirtyChanges = true;
            saveApp();
          }
          renderEditor();
        }
      });
    } catch {}

    updateStickyOffsets();
    try{ ensureActiveKpContext(s); renderKpPanel(); }catch{}
  }

  // 閲覧モード描画 (Stylish & Readable)

  function renderViewMode(s) {
    dom.editorBodyContainer.classList.add("hidden");
    dom.paperView.classList.remove("hidden");
    setupViewCopyHandler();
    try { dom.btnBackToEditFloating.classList.remove("hidden"); } catch {}
    // 閲覧モードではヘッダーも隠して没入感を高める（タイトルはPaper内に表示）
    dom.editorHeader.classList.add("hidden");
    dom.nav.innerHTML = "";

    normalizeScenarioData(s);

    // Hide chapters where all scenes are "used" in view mode
    const visibleChapters = (s.chapters || []).filter(ch => (ch.scenes || []).some(sc => {
      if (!SCENE_STATUS[sc.status]) sc.status = "unused";
      return sc.status !== "used" && sc.status !== "skipped";
    }));

    if (visibleChapters.length === 0) {
      dom.paperContent.innerHTML = "";
      const paperHead = document.createElement("div");
      paperHead.className = "paper-header";
      paperHead.innerHTML = `
        <h1 class="paper-title">${escapeHtml(s.title)}</h1>
        <div class="paper-meta">CHAPTER: （表示できる章がありません）</div>
      `;
      dom.paperContent.appendChild(paperHead);

      const body = document.createElement("div");
      body.className = "paper-body";
      body.innerHTML = `<div style="padding:18px 16px; background:#fff; border:1px solid #e5e7eb; border-radius:12px; color:#374151;">すべてのシーンが「使用済み」または「スキップ」になっているため、閲覧モードでは表示する内容がありません。</div>`;
      dom.paperContent.appendChild(body);
      return;
    }

    // Choose active chapter within visible chapters
    let activeChapterId = ensureCurrentChapter(s);
    if (!visibleChapters.some(ch => ch.id === activeChapterId)) {
      activeChapterId = visibleChapters[0].id;
      s.currentChapterId = activeChapterId;
      saveApp();
    }
    const activeChapter = visibleChapters.find(ch => ch.id === activeChapterId);
    if (!activeChapter) return;

    // サイドバー（章 + 表示中章のシーンのみ）
    let activeScenesNav = null;

    visibleChapters.forEach(ch => {
      const navItem = document.createElement("div");
      navItem.className = "nav-item nav-chapter" + (ch.id === activeChapterId ? " active" : "");
      navItem.textContent = ch.title;
      navItem.title = ch.title;
      navItem.onclick = () => setCurrentChapter(s, ch.id);
      dom.nav.appendChild(navItem);

      if (ch.id !== activeChapterId) return;

      // アクティブ章のシーンを章タイトルの直下にまとめる
      activeScenesNav = document.createElement("div");
      activeScenesNav.className = "nav-scenes";
      activeScenesNav.dataset.chapterId = ch.id;
      dom.nav.appendChild(activeScenesNav);

      (ch.scenes || []).forEach((sc, scIdx) => {
        if (!SCENE_STATUS[sc.status]) sc.status = "unused";
        if (sc.status === "used" || sc.status === "skipped") return;
        const sceneIndex = activeScenesNav.querySelectorAll('.nav-item.sub').length + 1;
        const subNav = document.createElement("div");
        subNav.className = "nav-item sub";
        subNav.dataset.num = sceneIndex;
        subNav.title = sc.title;
        const label = document.createElement("span");
        label.className = "nav-label";
        label.textContent = sc.title;
        subNav.appendChild(label);
        subNav.onclick = () => document.getElementById(`view-sc-${sc.id}`)?.scrollIntoView({ behavior: "smooth" });
        activeScenesNav.appendChild(subNav);
      });
    });

    dom.paperContent.innerHTML = "";

    // Paper Header
    const paperHead = document.createElement("div");
    paperHead.className = "paper-header";
    // Calculate chapter stats
    const chScenes = activeChapter.scenes || [];
    let chCharCount = 0;
    chScenes.forEach(sc => { chCharCount += stripHtmlToText(sc.body || "").length; });
    const totalSc = chScenes.length;
    const remainSc = chScenes.filter(sc => sc.status !== "used" && sc.status !== "skipped").length;
    const doneSc = totalSc - remainSc;
    paperHead.innerHTML = `
      <h1 class="paper-title">${escapeHtml(s.title)}</h1>
      <div class="paper-meta">CHAPTER: ${escapeHtml(activeChapter.title)} ─ ${totalSc} シーン ／ ${chCharCount.toLocaleString()} 字 ／ 進行 ${doneSc}/${totalSc}（残り ${remainSc}）</div>
    `;
    // KP visibility toggle
    const kpToggle = document.createElement("button");
    kpToggle.type = "button";
    kpToggle.className = "kp-vis-toggle";
    kpToggle.innerHTML = "🔒 KP情報を表示中";
    kpToggle.title = "KP専用メモの表示/非表示を切り替え（PL画面共有時に非表示にできます）";
    kpToggle.onclick = () => {
      const paperBody = dom.paperContent.querySelector(".paper-body");
      if (!paperBody) return;
      const isHidden = paperBody.classList.toggle("kp-hidden");
      kpToggle.innerHTML = isHidden ? "🔒 KP情報を非表示" : "🔒 KP情報を表示中";
      kpToggle.classList.toggle("kp-off", isHidden);
    };
    paperHead.appendChild(kpToggle);

    // 進行リセット：完了済み・スキップを含む全シーンを未使用に戻す
    const resetBtn = document.createElement("button");
    resetBtn.type = "button";
    resetBtn.className = "view-reset-btn";
    resetBtn.textContent = "🔄 全シーンを未使用に戻す";
    resetBtn.title = "完了・スキップにしたシーンをすべて未使用へ戻します（新しいセッション用）";
    resetBtn.onclick = () => {
      const cur = getCurrentScenario();
      if (!cur) return;
      const changed = (cur.chapters || []).reduce((n, ch) =>
        n + (ch.scenes || []).filter(sc => sc.status !== "unused").length, 0);
      if (changed === 0) { try { showToast("戻すシーンはありません"); } catch {} return; }
      if (!confirm(`完了・スキップにした ${changed} シーンをすべて未使用に戻しますか？`)) return;
      (cur.chapters || []).forEach(ch => (ch.scenes || []).forEach(sc => { sc.status = "unused"; }));
      cur.updatedAt = Date.now();
      saveApp();
      renderEditor();
      try { showToast("全シーンを未使用に戻しました"); } catch {}
    };
    paperHead.appendChild(resetBtn);

    dom.paperContent.appendChild(paperHead);

    const body = document.createElement("div");
    body.className = "paper-body";

    const chDiv = document.createElement("section");
    chDiv.className = "view-chapter";
    chDiv.id = `view-ch-${activeChapter.id}`;
    chDiv.innerHTML = `<h2 class="view-chapter-title">${activeChapter.title}</h2>`;

    const visibleScenes = (activeChapter.scenes || []).filter(sc => {
      if (!SCENE_STATUS[sc.status]) sc.status = "unused";
      return sc.status !== "used" && sc.status !== "skipped";
    });

    if (visibleScenes.length === 0) {
      // Chapter should not be displayed if no visible scenes
      body.innerHTML = `<div style="padding:18px 16px; background:#fff; border:1px solid #e5e7eb; border-radius:12px; color:#374151;">この章のシーンはすべて「使用済み」または「スキップ」のため、閲覧モードでは表示されません。</div>`;
      dom.paperContent.appendChild(body);
      return;
    }

    visibleScenes.forEach(sc => {
      const scDiv = document.createElement("article");
      scDiv.className = "view-scene";
      scDiv.id = `view-sc-${sc.id}`;
      scDiv.dataset.sceneId = sc.id;
      scDiv.dataset.chapterId = activeChapter.id;
      scDiv.addEventListener("pointerdown", () => { setActiveKpContext(sc.id, activeChapter.id); }, true);
      if (!SCENE_STATUS[sc.status]) sc.status = "unused";
      if (!Array.isArray(sc.tags)) sc.tags = [];
      const statusLabel = SCENE_STATUS[sc.status]?.label || "";
      const tagsHtml = (sc.tags || []).slice(0, 8).map(t => `<span class="tag-chip">${escapeHtml(t)}</span>`).join("");

      // View mode: 完了 / スキップ ボタンで状態を変更（プルダウンは廃止）
      const statusSelectHtml = `
        <button class="scene-done-btn" data-scene-done="${escapeHtml(sc.id)}" title="このシーンを使用済みにして隠す">✓ 完了</button>
        <button class="scene-skip-btn" data-scene-skip="${escapeHtml(sc.id)}" title="このシーンをスキップにして隠す">⏭ スキップ</button>
      `;
      const badgeHtml = "";
      scDiv.innerHTML = `
        <h3 class="view-scene-title">
          <span>${escapeHtml(sc.title)}</span>
          <span class="scene-meta-row" style="margin-left:auto;">
            ${statusSelectHtml}
            
            ${tagsHtml}
          </span>
        </h3>
      `;

      const contentDiv = document.createElement("div");
      contentDiv.className = "view-content";
      scDiv.appendChild(contentDiv);

      // View mode: render saved HTML directly (avoid Quill clipboard sanitization that can drop custom blocks)
      contentDiv.innerHTML = safeHTMLForView(sc.body);
      // 画像参照を表示用の実データへ解決
      try { resolveImagesIn(contentDiv); } catch {}
      // 探索者タグを名前に置換
      replacePcTagsInView(contentDiv, s);
      applyKpNoteShiftsInView(contentDiv);
      // Remove edit-only controls if they exist
      contentDiv.querySelectorAll('.copybox-remove').forEach(el => el.remove());
      // 閲覧モード：コピーボックスにツールチップ付与
      contentDiv.querySelectorAll('.copy-box').forEach(el => {
        if (!el.hasAttribute('title')) el.setAttribute('title', 'クリックしてコピー');
      });
      contentDiv.querySelectorAll('.ccfolia-line').forEach(el => {
        if (!el.hasAttribute('title')) el.setAttribute('title', 'クリックしてコピー');
      });

      chDiv.appendChild(scDiv);
    });

    body.appendChild(chDiv);
    dom.paperContent.appendChild(body);

    // 閲覧モード描画完了後、KPマージンメモを確実に再描画＆位置同期
    try {
      if (document.body.classList.contains("kp-panel-open")) {
        // 複数回遅延でアンカー可視化を待つ
        [10, 50, 150, 300, 600, 1000].forEach(ms => {
          setTimeout(() => {
            try { renderKpPanel(); } catch {}
            try { scheduleKpPanelSync(); } catch {}
          }, ms);
        });
      }
    } catch {}
}

    bind("sinfoPlayers", "players");

      hideEl.checked = !!s.hideFromDetail;

  function renderPcList(s) {
    const pcListEl = document.getElementById("pcList");
    if (!pcListEl) return;
    pcListEl.innerHTML = "";
    if (!s.explorers) s.explorers = [];

    s.explorers.forEach((pc, i) => {

      row.className = "pc-row";
      row.innerHTML = `
        <span class="pc-label">${escapeHtml(pc.label)}</span>
        <input type="text" value="${escapeHtml(pc.name || '')}" placeholder="名前を入力" data-pc-idx="${i}" />
        <button class="ghost danger" data-pc-del="${i}" style="padding:3px 6px; font-size:11px;">×</button>
      `;
      pcListEl.appendChild(row);
    });

    // イベント委譲
    pcListEl.querySelectorAll("input[data-pc-idx]").forEach(inp => {
      inp.addEventListener("input", (e) => {
        const idx = parseInt(e.target.dataset.pcIdx, 10);
        if (s.explorers[idx]) {
          s.explorers[idx].name = e.target.value;
          s.updatedAt = Date.now();
          __hasDirtyChanges = true;
        }
      });

          s.updatedAt = Date.now();
          saveApp();
          renderPcList(s);
        }
      });
    });
  }

  function getNextPcLabel(explorers) {
    // A, B, C, ... の次の空きラベルを返す
    const used = new Set((explorers || []).map(e => e.label));
    for (let i = 0; i < 26; i++) {
      const label = String.fromCharCode(65 + i);
      if (!used.has(label)) return label;
    }
    return "X";
  }

  function replacePcTagsInView(container, scenario) {
    if (!container || !scenario) return;
    const pcs = scenario.explorers || [];
    const map = new Map();
    pcs.forEach(pc => map.set(pc.label, pc.name || ('探索者' + pc.label)));

    container.querySelectorAll('.pc-tag').forEach(tag => {
      const label = tag.getAttribute('data-pc-label') || tag.textContent.replace('探索者','').trim();
      const name = map.get(label) || ('探索者' + label);
      const resolved = document.createElement('span');
      resolved.className = 'pc-tag-resolved';
      resolved.textContent = name;
      resolved.title = '探索者' + label;
      tag.replaceWith(resolved);
    });
  }

    if (btnSetCover) btnSetCover.onclick = () => coverFileInput && coverFileInput.click();

    if (coverFileInput) coverFileInput.addEventListener("change", async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const s = getCurrentScenario();
      if (!s) return;
      // 表紙用に小さめにリサイズ（最大600px、品質0.6）
      const dataUrl = await new Promise(resolve => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.readAsDataURL(file);
      });
      const compressed = await new Promise(resolve => {
        const img = new Image();
        img.onload = () => {
          try {
            const w = img.naturalWidth || img.width;
            const h = img.naturalHeight || img.height;
            const scale = Math.min(1, 600 / Math.max(w, h));
            const cw = Math.max(1, Math.round(w * scale));
            const ch = Math.max(1, Math.round(h * scale));
            const canvas = document.createElement('canvas');
            canvas.width = cw; canvas.height = ch;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, cw, ch);
            resolve(supportsWebP()
              ? canvas.toDataURL('image/webp', 0.75)
              : canvas.toDataURL('image/png'));
          } catch { resolve(dataUrl); }
        };
        img.onerror = () => resolve(dataUrl);
        img.src = dataUrl;
      });
      s.coverImage = compressed;
      s.updatedAt = Date.now();
      saveApp();
      renderEditor();
      coverFileInput.value = "";
    });

    const MIN = 200, MAX = 600;
    let saved = null;
    try { saved = parseInt(localStorage.getItem("trpg_sidebar_w"), 10); } catch {}
    if (saved && saved >= MIN && saved <= MAX) root.style.setProperty("--sidebar-w", saved + "px");

    if (handle && appEl) {
      let dragging = false;
      const onMove = (e) => {
        if (!dragging) return;
        const x = (e.touches ? e.touches[0].clientX : e.clientX);
        const w = Math.max(MIN, Math.min(MAX, Math.round(x)));
        root.style.setProperty("--sidebar-w", w + "px");
      };
      const onUp = () => {
        if (!dragging) return;
        dragging = false;
        handle.classList.remove("dragging");
        appEl.classList.remove("no-sidebar-transition");
        document.body.style.cursor = "";
        document.body.style.userSelect = "";
        try {
          const wv = parseInt(getComputedStyle(root).getPropertyValue("--sidebar-w"), 10);
          if (wv) localStorage.setItem("trpg_sidebar_w", String(wv));
        } catch {}
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);

        if (typeof isMobileLayout === "function" && isMobileLayout()) return;
        e.preventDefault();
        dragging = true;
        handle.classList.add("dragging");
        appEl.classList.add("no-sidebar-transition");

    const modal = document.getElementById("searchModal");
    const input = document.getElementById("searchInput");
    if (input) {
      input.addEventListener("input", () => updateSearchResults(input.value));
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          const first = document.querySelector("#searchResults .search-item");
          if (first) { first.click(); }
        }
      });
    }
    if (modal) {
      modal.addEventListener("mousedown", (e) => {
        if (e.target === modal) closeSearch();
      });
    }
  } catch {}

  // Ctrl+F / Cmd+F opens app search, Ctrl+S / Cmd+S triggers save feedback
  window.addEventListener("keydown", (e) => {
    const isFind = (e.key === "f" || e.key === "F") && (e.ctrlKey || e.metaKey);
    if (isFind) {
      e.preventDefault();
      FindBar.open();
      return;
    }
    const isSave = (e.key === "s" || e.key === "S") && (e.ctrlKey || e.metaKey);
    if (isSave) {
      e.preventDefault();
      try { saveApp(); showToast("保存しました"); } catch {}
      return;
    }
    if (e.key === "Escape") {
      if (FindBar.isOpen()) { e.preventDefault(); FindBar.close(); return; }
      const modal = document.getElementById("searchModal");
      if (modal && modal.classList.contains("show")) {
        e.preventDefault();
        closeSearch();
      }
    }
  }, true);

// Init
  window.addEventListener("resize", updateStickyOffsets);

  window.addEventListener("hashchange", () => {
    const s = getCurrentScenario();
    if (!s) return;
    const id = parseChapterIdFromHash();
    if (id && s.chapters?.some(ch => ch.id === id) && s.currentChapterId !== id) {
      s.currentChapterId = id;
      saveApp();
      renderEditor();
    }
  });

  // Image modal events
  (function(){
    const modal = document.getElementById('imgModal');
    const closeBtn = document.getElementById('imgModalClose');
    if (closeBtn) closeBtn.addEventListener('click', closeImageModal, true);
    if (modal) {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeImageModal();
      }, true);
    }
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeImageModal();
    }, true);
  })();




</script>
</body>
</html>
