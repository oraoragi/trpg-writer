   本文には "trpgimg:{id}" という参照だけを残し、実データは
   別ドキュメント（Firestore: users/{uid}/images/{id}）と
   ローカル（IndexedDB の専用キー）に分けて保存する。
   これにより1シナリオが1MiB上限に当たらなくなる。
   ========================================================= */
const IMAGE_REF_PREFIX = "trpgimg:";
const IMAGES_LOCAL_KEY = "trpg_writer_images";
// 未ロード時に表示する軽量プレースホルダ
const IMAGE_PLACEHOLDER =
  "data:image/svg+xml;charset=utf-8," +
  encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="160" height="120"><rect width="160" height="120" fill="#e9ecef"/><text x="80" y="64" font-size="12" fill="#868e96" text-anchor="middle">読み込み中…</text></svg>');

const __imageCache = new Map();   // id -> dataURL
const __imageDirty = new Set();   // 未保存の画像ID
let __localAdapterRef = null;     // ローカル保存用アダプタ（initAppで設定）

function isImageRef(v) {
  return typeof v === "string" && v.indexOf(IMAGE_REF_PREFIX) === 0;
}
function imageIdFromRef(ref) {
  return String(ref).slice(IMAGE_REF_PREFIX.length);
}
function newImageId() {
  return "im_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
}

// dataURL を取り込んで参照文字列を返す
function putImage(dataUrl) {
  if (typeof dataUrl !== "string" || dataUrl.indexOf("data:") !== 0) return dataUrl;
  const id = newImageId();
  __imageCache.set(id, dataUrl);
  __imageDirty.add(id);
  return IMAGE_REF_PREFIX + id;
}

// 参照を実データに解決（未ロードならプレースホルダ）
function resolveImageSrc(v) {
  if (!isImageRef(v)) return v;
  return __imageCache.get(imageIdFromRef(v)) || IMAGE_PLACEHOLDER;
}

// 文字列（HTML等）に含まれる画像参照IDを全部拾う
function collectImageIds(text, out) {
  if (typeof text !== "string" || !text) return out;
  const re = /trpgimg:(im_[a-z0-9_]+)/gi;
  let m;
  while ((m = re.exec(text)) !== null) out.add(m[1]);
  return out;
}

// シナリオ1件が参照している画像IDを集める
function scenarioImageIds(sc, out) {
  out = out || new Set();
  if (!sc) return out;
  try {
    const chapters = Array.isArray(sc.chapters) ? sc.chapters : [];
    for (const ch of chapters) {
      const scenes = (ch && Array.isArray(ch.scenes)) ? ch.scenes : [];
      for (const scene of scenes) collectImageIds(scene && scene.body, out);
    }
    // 念のため、構造外に残った参照も拾う
    collectImageIds(JSON.stringify(sc.kpNotes || null), out);
  } catch {}
  return out;
}

function allImageIds() {
  const out = new Set();
  try {
    for (const sc of (app && app.scenarios) || []) scenarioImageIds(sc, out);
  } catch {}
  return out;
}

// --- 読み込み ---
async function loadImagesFromLocal(ids) {
  if (!__localAdapterRef || !ids.length) return;
  try {
    const map = await asPromise(__localAdapterRef.load(IMAGES_LOCAL_KEY));
    if (!map || typeof map !== "object") return;
    for (const id of ids) {
      if (!__imageCache.has(id) && typeof map[id] === "string") __imageCache.set(id, map[id]);
    }
  } catch (err) {
    try { console.warn("local image load failed:", err); } catch {}
  }
}

async function loadImagesFromCloud(ids) {
  const uid = (__firebaseAuth && __firebaseAuth.currentUser) ? __firebaseAuth.currentUser.uid : null;
  if (!__firebaseDb || !uid || !ids.length) return;
  const col = __firebaseDb.collection("users").doc(uid).collection("images");
  await Promise.all(ids.map(async (id) => {
    if (__imageCache.has(id)) return;
    try {
      const snap = await col.doc(id).get();
      if (snap.exists) {
        const d = snap.data();
        if (d && typeof d.data === "string") __imageCache.set(id, d.data);
      }
    } catch (err) {
      try { console.warn("cloud image load failed:", id, err); } catch {}
    }
  }));
}

// シナリオを開く前に、そのシナリオが使う画像だけを取り寄せる
async function ensureImagesForScenario(sc) {
  const ids = Array.from(scenarioImageIds(sc)).filter(id => !__imageCache.has(id));
  if (!ids.length) return;
  await loadImagesFromLocal(ids);
  const stillMissing = ids.filter(id => !__imageCache.has(id));
  if (stillMissing.length) await loadImagesFromCloud(stillMissing);
}

// 指定範囲の img を「参照 -> 実データ」に解決する。
// 保存HTMLでは src に参照文字列が入っているため、表示前に必ず通す。
function resolveImagesIn(rootEl) {
  if (!rootEl || !rootEl.querySelectorAll) return;
  try {
    rootEl.querySelectorAll("img").forEach(img => {
      let ref = img.getAttribute("data-img-ref");
      const src = img.getAttribute("src") || "";
      if (!ref && isImageRef(src)) ref = src;
      if (!ref) return;
      img.setAttribute("data-img-ref", ref);
      const resolved = resolveImageSrc(ref);
      if (resolved && src !== resolved) img.setAttribute("src", resolved);
    });
  } catch {}
}

// 画面上のプレースホルダを実データに差し替える
function refreshRenderedImages() {
  try {
    resolveImagesIn(document);
  } catch {}
}

// --- 保存 ---
async function flushImages() {
  const referenced = allImageIds();

  // 参照が切れた画像はキャッシュからも落とす（保存対象から除外）
  for (const id of Array.from(__imageCache.keys())) {
    if (!referenced.has(id)) {
      __imageCache.delete(id);
      __imageDirty.delete(id);
    }
  }

  // ローカルには参照中の全画像をまとめて保存（サイズ上限が無いので一括でよい）
  if (__localAdapterRef) {
    try {
      const map = {};
      __imageCache.forEach((v, k) => { if (referenced.has(k)) map[k] = v; });
      await asPromise(__localAdapterRef.save(IMAGES_LOCAL_KEY, map));
    } catch (err) {
      try { console.warn("local image save failed:", err); } catch {}
    }
  }

  // クラウドには新規分のみ1枚1ドキュメントで書き込む
  const uid = (__firebaseAuth && __firebaseAuth.currentUser) ? __firebaseAuth.currentUser.uid : null;
  if (!__firebaseDb || !uid) return;

  const col = __firebaseDb.collection("users").doc(uid).collection("images");
  const pending = Array.from(__imageDirty).filter(id => referenced.has(id) && __imageCache.has(id));

  for (const id of pending) {
    const dataUrl = __imageCache.get(id);
    const bytes = new Blob([dataUrl]).size;
    if (bytes > FIRESTORE_DOC_LIMIT) {
      throw new Error(`画像1枚がクラウド保存の上限を超えています（${Math.round(bytes / 1024)}KB）。より小さい画像を使ってください。`);
    }
    await col.doc(id).set({ data: dataUrl, createdAt: Date.now() });
    __imageDirty.delete(id);
  }
}

// 旧データ移行: シーン本文に直接埋まっている data: URL を画像ストアへ切り出す。
// dataset.images（JSON配列）と、素の <img src="data:..."> の両方に対応する。
function migrateInlineImages() {
  let changed = false;

  const convert = (html) => {
    if (typeof html !== "string" || html.indexOf("data:image") === -1) return html;
    let out = html;

    // 1) ギャラリーの data-images 属性（HTMLエスケープされたJSON配列）
    out = out.replace(/data-images="([^"]*)"/g, (whole, encoded) => {
      try {
        const json = encoded.replace(/&quot;/g, '"').replace(/&amp;/g, "&");
        const arr = JSON.parse(json);
        if (!Array.isArray(arr)) return whole;
        let touched = false;
        const mapped = arr.map(v => {
          if (typeof v === "string" && v.indexOf("data:") === 0) { touched = true; return putImage(v); }
          return v;
        });
        if (!touched) return whole;
        changed = true;
        const rebuilt = JSON.stringify(mapped).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
        return `data-images="${rebuilt}"`;
      } catch {
        return whole;
      }
    });

    // 2) 素の img タグに残った data: URL
    out = out.replace(/src="(data:image\/[^"]+)"/g, (whole, url) => {
      const ref = putImage(url);
      if (ref === url) return whole;
      changed = true;
      return `src="${ref}" data-img-ref="${ref}"`;
    });

    return out;
  };

  try {
    for (const sc of (app && app.scenarios) || []) {
      for (const ch of (sc && sc.chapters) || []) {
        for (const scene of (ch && ch.scenes) || []) {
          if (!scene) continue;
          const next = convert(scene.body);
          if (next !== scene.body) scene.body = next;
        }
      }
    }
  } catch (err) {
    try { console.warn("migrateInlineImages failed:", err); } catch {}
  }

  return changed;
}

// 参照されなくなったクラウド上の画像を掃除する（失敗しても致命的ではない）
async function cleanupOrphanImages() {
  const uid = (__firebaseAuth && __firebaseAuth.currentUser) ? __firebaseAuth.currentUser.uid : null;
  if (!__firebaseDb || !uid) return;
  try {
    const referenced = allImageIds();
    const col = __firebaseDb.collection("users").doc(uid).collection("images");
    const snap = await col.get();
    const orphans = [];
    snap.forEach(d => { if (!referenced.has(d.id)) orphans.push(d.id); });
    for (let i = 0; i < orphans.length; i += 400) {
      const batch = __firebaseDb.batch();
      orphans.slice(i, i + 400).forEach(id => batch.delete(col.doc(id)));
      await batch.commit();
    }
    if (orphans.length) console.info(`未使用画像を${orphans.length}件削除しました`);
  } catch (err) {
    try { console.warn("orphan image cleanup failed:", err); } catch {}
  }
}

// --- クラウド保存サイズの常時表示 ---
let __docSizeTimer = null;

function formatBytes(n) {
  if (n < 1024) return n + "B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + "KB";
  return (n / 1024 / 1024).toFixed(2) + "MB";
}

// 上限はシナリオ1件ごとに掛かるため、最大のシナリオを監視対象にする
function measureLargestScenario() {
  let max = 0, title = "", total = 0;
  try {
    const list = (app && Array.isArray(app.scenarios)) ? app.scenarios : [];
    for (const sc of list) {
      if (!sc) continue;
      const b = new Blob([JSON.stringify(sc)]).size;
      total += b;
      if (b > max) { max = b; title = sc.title || "（無題）"; }
    }
  } catch {}
  return { max, title, total, count: (app && Array.isArray(app.scenarios)) ? app.scenarios.length : 0 };
}

function updateDocSizeUI() {
  const el = document.getElementById("docSize");
  if (!el) return;
  const { max, title, total, count } = measureLargestScenario();
  const pct = Math.round((max / FIRESTORE_DOC_LIMIT) * 100);
  el.textContent = `最大 ${formatBytes(max)} / 1MB (${pct}%)`;
  el.classList.remove("warn", "over");

  let imgInfo = "";
  try {
    let imgMax = 0, imgTotal = 0;
    __imageCache.forEach(v => { const b = new Blob([v]).size; imgTotal += b; if (b > imgMax) imgMax = b; });
    imgInfo = `\n画像: ${__imageCache.size}枚 / 最大${formatBytes(imgMax)} / 計${formatBytes(imgTotal)}`;
  } catch {}
  const base = `最大シナリオ: ${title}\n全${count}件の合計: ${formatBytes(total)}${imgInfo}\n上限はシナリオ1件・画像1枚ごとに約1MBです`;
  if (max > FIRESTORE_DOC_LIMIT) {
    el.classList.add("over");
    el.title = "上限超過: このシナリオはクラウド保存に失敗します。画像を減らすか小さくしてください。\n" + base;
  } else if (pct >= 75) {
    el.classList.add("warn");
    el.title = "このシナリオが上限に近づいています。\n" + base;
  } else {
    el.title = base;
  }
}

// 計測はJSON化を伴うため、連続呼び出しをまとめる
function scheduleDocSizeUpdate() {
  if (__docSizeTimer) clearTimeout(__docSizeTimer);
  __docSizeTimer = setTimeout(() => { try { updateDocSizeUI(); } catch {} }, 500);
}
window.scheduleDocSizeUpdate = scheduleDocSizeUpdate;

function initFirebase() {
  try {
    if (typeof firebase === "undefined") return false;
    __firebaseApp = firebase.initializeApp(__firebaseConfig);
    __firebaseAuth = firebase.auth();
    __firebaseDb = firebase.firestore();
    // Enable offline persistence (data available even without network)
    __firebaseDb.enablePersistence({ synchronizeTabs: true }).catch(() => {});
    return true;
  } catch (err) {
    console.warn("Firebase init failed:", err);
    return false;
  }
}

// Firestore構成（v2）:
//   users/{uid}/data/app_index      … 並び順・選択中ID・保存時刻のみ（軽量）
//   users/{uid}/scenarios/{id}      … シナリオ1件につき1ドキュメント
// 1ドキュメント1MiBの上限がシナリオ単位に分散されるため、全体では実質的に上限が無くなる。
// 旧形式 users/{uid}/data/app_state は移行後も削除せず、復旧用に残す。
function createFirestoreAdapter(userId) {
  if (!__firebaseDb || !userId) return null;
  const userRef = __firebaseDb.collection("users").doc(userId);
  const legacyRef = userRef.collection("data").doc("app_state");
  const indexRef = userRef.collection("data").doc("app_index");
  const scenariosRef = userRef.collection("scenarios");

  // 直近にクラウドへ書き込んだ内容（差分書き込み・削除検知に使う）
  let lastSaved = Object.create(null); // { [id]: payload文字列 }
  let lastOrder = [];                  // クラウド上に存在するとわかっているID

  const MAX_BATCH_OPS = 400; // Firestoreのバッチ上限500に対し安全側

  async function commitInChunks(writes) {
    for (let i = 0; i < writes.length; i += MAX_BATCH_OPS) {
      const batch = __firebaseDb.batch();
      writes.slice(i, i + MAX_BATCH_OPS).forEach(w => w(batch));
      await batch.commit();
    }
  }

  return {
    name: "firestore",

    async load(key) {
      // --- 新形式（v2）を試す ---
      let indexSnap = null;
      try { indexSnap = await indexRef.get(); } catch (err) { console.warn("Firestore index load failed:", err); }

      if (indexSnap && indexSnap.exists) {
        try {
          const meta = JSON.parse((indexSnap.data() || {}).payload || "{}");
          const order = Array.isArray(meta.order) ? meta.order.map(String) : [];

          const snap = await scenariosRef.get();
          const byId = new Map();
          snap.forEach(d => {
            try {
              const sc = JSON.parse((d.data() || {}).payload || "null");
              if (sc && sc.id) byId.set(String(sc.id), sc);
            } catch {}
          });

          // 並び順に載っているものだけを採用する。
          // 順序外のドキュメントを拾うと、削除したシナリオが復活してしまうため。
          const scenarios = [];
          order.forEach(id => { if (byId.has(id)) scenarios.push(byId.get(id)); });

          // 順序外に残った孤児ドキュメントは掃除する（失敗しても致命的ではない）
          const orphans = [];
          byId.forEach((_, id) => { if (order.indexOf(id) === -1) orphans.push(id); });
          if (orphans.length) {
            commitInChunks(orphans.map(id => (b) => b.delete(scenariosRef.doc(id))))
              .catch(err => console.warn("orphan cleanup failed:", err));
          }

          lastSaved = Object.create(null);
          scenarios.forEach(sc => { try { lastSaved[String(sc.id)] = JSON.stringify(sc); } catch {} });
          lastOrder = scenarios.map(sc => String(sc.id));

          return {
            currentScenarioId: meta.currentScenarioId || null,
            scenarios,
            savedAt: Number(meta.savedAt || 0)
          };
        } catch (err) {
          console.warn("Firestore v2 load failed:", err);
        }
      }

      // --- 旧形式（v1）からの読み込み。次回保存時に自動でv2へ移行する ---
      try {
        const snap = await legacyRef.get();
        if (snap.exists) {
          const data = snap.data();
          const parsed = data && data.payload ? JSON.parse(data.payload) : null;
          if (parsed && Array.isArray(parsed.scenarios)) {
            lastSaved = Object.create(null); // 全件を新形式で書き直させる
            lastOrder = [];
            return parsed;
          }
        }
      } catch (err) {
        console.warn("Firestore legacy load failed:", err);
      }

      return null;
    },

    save(key, value) {
      // Debounced write
      return new Promise((resolve, reject) => {
        if (__firestoreSaveTimer) clearTimeout(__firestoreSaveTimer);
        __firestoreSaveTimer = setTimeout(async () => {
          try {
            updateSyncUI("syncing");

            const scenarios = Array.isArray(value && value.scenarios) ? value.scenarios : [];

            // シナリオ単位でサイズを検査（超過は1件でも書き込み前に止める）
            const items = [];
            for (const sc of scenarios) {
              if (!sc || !sc.id) continue;
              const payload = JSON.stringify(sc);
              const bytes = new Blob([payload]).size;
              if (bytes > FIRESTORE_DOC_LIMIT) {
                updateSyncUI("error");
                reject(new Error(
                  `シナリオ「${sc.title || "無題"}」がクラウド保存の上限超過（${Math.round(bytes / 1024)}KB / 上限約1000KB）。このシナリオの画像を減らすか小さくしてください。`
                ));
                return;
              }
              items.push({ id: String(sc.id), payload, updatedAt: Number(sc.updatedAt || 0) });
            }

            const writes = [];
            const currentIds = new Set(items.map(it => it.id));

            // 変更があったシナリオだけ書き込む
            for (const it of items) {
              if (lastSaved[it.id] === it.payload) continue;
              writes.push((b) => b.set(scenariosRef.doc(it.id), {
                payload: it.payload,
                updatedAt: it.updatedAt,
                syncedAt: firebase.firestore.FieldValue.serverTimestamp(),
                version: 2
              }));
            }

            // 削除されたシナリオのドキュメントを消す
            for (const id of lastOrder) {
              if (!currentIds.has(id)) writes.push((b) => b.delete(scenariosRef.doc(id)));
            }

            // 並び順インデックス（本文を含まないため常に軽量）
            const meta = JSON.stringify({
              version: 2,
              order: items.map(it => it.id),
              currentScenarioId: (value && value.currentScenarioId) || null,
              savedAt: Number((value && value.savedAt) || Date.now())
            });
            writes.push((b) => b.set(indexRef, {
              payload: meta,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
              version: 2
            }));

            await commitInChunks(writes);

            // 書き込み成功後に基準を更新
            const next = Object.create(null);
            items.forEach(it => { next[it.id] = it.payload; });
            lastSaved = next;
            lastOrder = items.map(it => it.id);

            updateSyncUI("online");
            resolve(true);
          } catch (err) {
            console.warn("Firestore save failed:", err);
            updateSyncUI("error");
            reject(err);
          }
        }, FIRESTORE_SAVE_DELAY);
      });
    }
  };
}

// Dual-write adapter: saves to both Firestore AND local IndexedDB
// オンライン同期前提のため、読み込みは常にFirestoreを正とし、
// 取得できなかった場合のみローカル控えを使う。
function createDualAdapter(firestoreAdapter, localAdapter) {
  const isValid = (v) => v && typeof v === "object" && Array.isArray(v.scenarios);
  return {
    name: "firestore+local",
    async load(key) {
      let remote = null;
      try { remote = await asPromise(firestoreAdapter.load(key)); } catch {}
      if (isValid(remote)) return remote;

      let local = null;
      try { local = await asPromise(localAdapter.load(key)); } catch {}
      return isValid(local) ? local : null;
    },
    async save(key, value) {
      // ローカル控えを先に書く（失敗してもクラウド保存は続行する）
      try {
        await asPromise(localAdapter.save(key, value));
      } catch (err) {
        try { console.warn("local mirror save failed:", err); } catch {}
      }
      // クラウド保存の失敗は握りつぶさず呼び出し元へ伝える（保存失敗の隠蔽を防止）
      await asPromise(firestoreAdapter.save(key, value));
      return true;
    }
  };
}

// --- Auth & Sync UI ---
function updateSyncUI(state) {
  const dot = document.getElementById("syncDot");
  const label = document.getElementById("syncLabel");
  const userEl = document.getElementById("syncUser");
  const btnLogin = document.getElementById("btnLogin");
  const btnLogout = document.getElementById("btnLogout");
  if (!dot || !label) return;

  dot.className = "sync-dot";

  if (__firebaseUser) {
    if (btnLogin) btnLogin.classList.add("hidden");
    if (btnLogout) btnLogout.classList.remove("hidden");
    if (userEl) {
      userEl.textContent = __firebaseUser.displayName || __firebaseUser.email || "ログイン中";
      userEl.classList.remove("hidden");
    }
  } else {
    if (btnLogin) btnLogin.classList.remove("hidden");
    if (btnLogout) btnLogout.classList.add("hidden");
    if (userEl) userEl.classList.add("hidden");
  }

  switch (state) {
    case "online":
      dot.classList.add("online");
      label.textContent = "同期済み";
      break;
    case "syncing":
      dot.classList.add("syncing");
      label.textContent = "同期中…";
      break;
    case "error":
      label.textContent = "同期エラー";
      break;
    case "offline":
    default:
      label.textContent = __firebaseUser ? "ローカル保存" : "オフライン";
      break;
  }
}

async function handleLogin() {
  if (!__firebaseAuth) { showToast("Firebase未初期化"); return; }
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    await __firebaseAuth.signInWithPopup(provider);
    // onAuthStateChanged will handle the rest
  } catch (err) {
    if (err.code === "auth/popup-closed-by-user") return;
    console.warn("Login failed:", err);
    showToast("ログインに失敗しました");
  }
}

async function handleLogout() {
  if (!__firebaseAuth) return;
  try {
    await __firebaseAuth.signOut();
    __firebaseUser = null;
    // Revert to local-only adapter
    const localAdapter = (typeof indexedDB !== "undefined") ? createIndexedDBAdapter() : createLocalStorageAdapter();
    __storageAdapter = localAdapter;
    updateSyncUI("offline");
    showToast("ログアウトしました（ローカル保存に切替）");
  } catch (err) {
    console.warn("Logout failed:", err);
  }
}

async function onAuthStateChanged(user) {
  __firebaseUser = user || null;
  if (user) {
    // Create Firestore adapter and switch to dual-write
    const fsAdapter = createFirestoreAdapter(user.uid);
    const localAdapter = (typeof indexedDB !== "undefined") ? createIndexedDBAdapter() : createLocalStorageAdapter();
    if (fsAdapter) {
      const dualAdapter = createDualAdapter(fsAdapter, localAdapter);
      __storageAdapter = dualAdapter;

      // Reload data from Firestore (may have newer data from another device)
      try {
        updateSyncUI("syncing");
        const loaded = await asPromise(dualAdapter.load(STORAGE_KEY));
        if (loaded && typeof loaded === "object" && Array.isArray(loaded.scenarios)) {
          app = loaded;
          normalizeAppData();
        }
        // Always start from home screen after login/reload
        app.currentScenarioId = null;
        renderHome();
        updateSyncUI("online");
        showToast("クラウド同期が有効になりました");
      } catch (err) {
        console.warn("Post-login data load failed:", err);
        updateSyncUI("error");
      }
    }
  } else {
    // ログアウト状態 or 未ログイン：ローカルアダプタに切り替え
    const localAdapter = (typeof indexedDB !== "undefined") ? createIndexedDBAdapter() : createLocalStorageAdapter();
    __storageAdapter = localAdapter;

    // ローカルからデータを再読み込み（initAppより後にonAuthStateChangedが呼ばれる場合に対応）
    try {
      let loaded = null;
      try { loaded = await asPromise(localAdapter.load(STORAGE_KEY)); } catch {}

      // 現在のメモリ上が空で、ローカルに実データがある場合のみ差し替える
      if (loaded && typeof loaded === "object" && Array.isArray(loaded.scenarios) && loaded.scenarios.length) {
        const curCount = (app && Array.isArray(app.scenarios)) ? app.scenarios.length : 0;
        const curStamp = Number((app && app.savedAt) || 0);
        const newStamp = Number(loaded.savedAt || 0);
        if (curCount === 0 || newStamp > curStamp) {
          app = loaded;
          normalizeAppData();
          app.currentScenarioId = null;
          renderHome();
        }
      }
    } catch {}

    updateSyncUI("offline");
  }
}

/**
 * Async initialization:
 * - Prefer IndexedDB when available
 * - Fall back to localStorage if IndexedDB is unavailable or blocked
 * - Finally, fall back to memory
 */
async function initApp() {

  renderHome();

  // 高速な初回描画用。IndexedDBを正とし、無い場合のみ旧localStorageデータを救済する。
  const idbAdapter = (typeof indexedDB !== "undefined") ? createIndexedDBAdapter() : null;
  const lsAdapter = createLocalStorageAdapter();
  const isValidApp = (v) => v && typeof v === "object" && Array.isArray(v.scenarios);

      loaded = null;
    }
  }

  __localAdapterRef = idbAdapter || lsAdapter;

  if (isValidApp(loaded)) {
    __storageAdapter = idbAdapter;
  } else {
    // IndexedDBが空/使用不可の場合のみ、旧localStorageデータを読む
    try { loaded = await asPromise(lsAdapter.load(STORAGE_KEY)); } catch { loaded = null; }
    __storageAdapter = idbAdapter || lsAdapter;
  }

  // どちらも空なら初期状態から始める（この時点では保存しない）
  app = isValidApp(loaded) ? loaded : deepClone(DEFAULT_APP);
  normalizeAppData();

  // 本文に直接埋まっているBase64画像を画像ストアへ切り出す（旧データの移行）
  try {

    }
  } catch (err) {
    try { console.warn("image migration failed:", err); } catch {}
  }

  // Mark hydration complete (safe to persist changes).
  __hydrated = true;

  // Always start from home screen on page load
  app.currentScenarioId = null;
  renderHome();
  try { updateDocSizeUI(); } catch {}
}

function saveApp() {
  const status = document.getElementById("saveStatus");
  if (!__hydrated) { if (status) status.textContent = "未保存（読込中）"; return; }

  // デバウンス待ちの未確定編集を先に確定（保存直前の入力落ちを防止）
  try { if (typeof window.flushScenarioSave === "function") window.flushScenarioSave(); } catch {}

  // 保存時刻を記録（起動時にどちらのストレージが新しいか判定するため）
  try { app.savedAt = Date.now(); } catch {}

  // クラウド保存サイズ表示を更新
  try { updateDocSizeUI(); } catch {}

  // 画像は本体とは別ドキュメントへ保存する
  const imagesDone = (async () => {
    try {
      await flushImages();
    } catch (err) {
      if (status) status.textContent = "画像の保存に失敗";
      try { showToast(String((err && err.message) || err)); } catch {}
      throw err;
    }
  })();


  const onOk = () => {
    __hasDirtyChanges = false;
    if (status) {
      status.textContent = "保存済み";
      setTimeout(() => { try { if (!__hasDirtyChanges) status.textContent = ""; } catch {} }, 2000);
    }
    try { scheduleCharCountUpdate(); } catch {}
  };

  const onFail = (err) => {
    const msg = String((err && err.message) || "");
    if (status) {
      status.textContent = /上限超過/.test(msg) ? "保存失敗: 容量超過" : "保存失敗（容量/権限/通信）";
    }
    try { console.warn("saveApp failed:", err); } catch {}
    try { if (msg) showToast(msg); } catch {}

    // 容量超過時はメモリへ退避してUIを止めない（アダプタ種別を問わない）
    if (__storageAdapter && __storageAdapter.name !== "memory" && isQuotaExceededError(err)) {
      try {
        __storageAdapter = createMemoryAdapter();
        const r2 = __storageAdapter.save(STORAGE_KEY, app);
        asPromise(r2).then(() => {
          if (status) status.textContent = "容量上限: 一時保存（再読み込みで消えます）";
        }).catch(() => {});
      } catch {}
    }
  };

  try {
    if (status) status.textContent = "保存中…";
    // 画像の保存完了を待ってから本体を保存する（参照だけ残って画像が無い状態を避ける）
    imagesDone
      .then(() => asPromise(__storageAdapter.save(STORAGE_KEY, app)))
      .then(onOk)
      .catch(onFail);
  } catch (err) {
    onFail(err);
  }
}

function ensureKpMemos(s){
  if (!s || typeof s !== "object") return;
  // Backward compat: object-map -> array
  if (s.kpMemos && !Array.isArray(s.kpMemos) && typeof s.kpMemos === "object") {
    try {
      s.kpMemos = Object.values(s.kpMemos);
    } catch { s.kpMemos = []; }
  }
  if (!Array.isArray(s.kpMemos)) s.kpMemos = [];
  // Normalize each memo shape
  for (const n of s.kpMemos) {
    if (!n || typeof n !== "object") continue;
    if (!n.id) n.id = "kp_" + Math.random().toString(36).slice(2, 10);
    if (typeof n.title !== "string") n.title = "";
    if (typeof n.body !== "string") n.body = "";
    // backward compat: anchorId based memos
    if ((n.sceneId === undefined || n.sceneId === null) && typeof n.anchorId === "string" && n.anchorId) {
      n.sceneId = null;
    }
        if (typeof n.sceneId !== "string" && n.sceneId !== null) n.sceneId = n.sceneId == null ? null : String(n.sceneId);
    if (!n.createdAt) n.createdAt = Date.now();
    if (!n.updatedAt) n.updatedAt = n.createdAt;
    if (typeof n.order !== "number") n.order = 0;
  }
  // Stable order (keep insertion order if order ties)
  s.kpMemos.sort((a,b) => (a.order||0) - (b.order||0) || (a.createdAt||0) - (b.createdAt||0));
}

  function syncKpPanelPositions(){

    const paperScroll = document.getElementById("paperView");
    const isEditMode = !!(editorScroll && editorScroll.offsetParent !== null);
    const marginEl = document.getElementById(isEditMode ? "kpMarginEdit" : "kpMarginView");
    const scrollRoot = isEditMode ? editorScroll : paperScroll;
    if (!marginEl || !scrollRoot) return;

    const cards = Array.from(marginEl.querySelectorAll(".kp-card[data-kp-id]"));
    if (cards.length === 0) return;

    // marginEl自身のoffsetTopを参照基準にする（同じflexコンテナの子なら座標系が揃う）
    const wrapEl = marginEl.parentElement;
    if (!wrapEl) return;
    const wrapRect = wrapEl.getBoundingClientRect();

    const anchorData = [];
    cards.forEach(card => {
      const id = card.dataset.kpId;
      const anchorList = Array.from(document.querySelectorAll(`.kp-anchor[data-kp-id="${CSS.escape(id)}"]`));
      // 複数見つかった場合は「可視な（サイズがある）」ものを優先
      let anchor = null;
      for (const a of anchorList) {
        const r = a.getBoundingClientRect();
        if (r.width > 0 || r.height > 0) { anchor = a; break; }
      }
      if (!anchor && anchorList.length) anchor = anchorList[0];

      if (anchor) {
        const aRect = anchor.getBoundingClientRect();
        if (aRect.width === 0 && aRect.height === 0 && aRect.top === 0) {
          anchorData.push({ card, targetY: null });
          return;
        }
        const relTop = aRect.top - wrapRect.top;
        anchorData.push({ card, targetY: Math.max(0, relTop) });
      } else {
        anchorData.push({ card, targetY: null });
      }
    });

    const withAnchor = anchorData.filter(d => d.targetY !== null)
      .sort((a, b) => a.targetY - b.targetY);
    const withoutAnchor = anchorData.filter(d => d.targetY === null);

    let prevBottom = 0;
    withAnchor.forEach(d => {
      let y = d.targetY;
      if (y < prevBottom + 8) y = prevBottom + 8;
      d.card.style.top = y + "px";
      prevBottom = y + d.card.offsetHeight;
    });

    let nextY = prevBottom + 16;
    withoutAnchor.forEach(d => {
      d.card.style.top = nextY + "px";
      nextY += d.card.offsetHeight + 8;

  function attachKpAnchorSafety(quill){
  if (!quill) return;
  // Track last focused Quill
  try{
    quill.root.addEventListener("focusin", () => { window.__trpg_lastFocusedQuill = quill; });
    quill.root.addEventListener("mousedown", () => { window.__trpg_lastFocusedQuill = quill; });
  }catch{}

  // KP anchor is NOT deletable from the main text.
  const denyDelete = () => { try{ showToast("KPメモの🔒は本文から削除できません（KPメモバーから削除してください）"); }catch{} };

  // Robust protection: block via beforeinput/keydown as well (Quill keyboard bindings can be bypassed)
  const rangeHasKpAnchor = (range) => {
    if (!range) return false;
    try{
      if (range.length > 0){
        const d = quill.getContents(range.index, range.length);
        return (d && d.ops || []).some(op => op && op.insert && op.insert.kpanchor);
      }
      return false;
    }catch{ return false; }
  };
  const leafIsKpAnchor = (index) => {
    try{
      const [leaf] = quill.getLeaf(index);
      return !!(leaf && leaf.statics && leaf.statics.blotName === 'kpanchor');
    }catch{ return false; }
  };
  const willDeleteKpAnchor = (range, dir) => {
    if (!range) return false;
    if (range.length > 0) return rangeHasKpAnchor(range);
    if (dir === 'backward'){
      if (range.index <= 0) return false;
      return leafIsKpAnchor(range.index - 1);
    }
    if (dir === 'forward'){
      return leafIsKpAnchor(range.index);
    }
    return false;
  };

  try{
    const onBeforeInput = (e) => {
      const t = e && e.inputType ? String(e.inputType) : '';
      if (!t.startsWith('delete')) return;
      const range = quill.getSelection();
      if (!range) return;
      const dir = (t === 'deleteContentBackward' || t === 'deleteByCut' || t === 'deleteByDrag') ? 'backward'
                : (t === 'deleteContentForward') ? 'forward'
                : (t === 'delete') ? 'forward'
                : null;

      if (range.length > 0){
        if (rangeHasKpAnchor(range)){
          e.preventDefault();
          e.stopPropagation();
          denyDelete();
        }
        return;
      }
      if (dir && willDeleteKpAnchor(range, dir)){
        e.preventDefault();
        e.stopPropagation();
        denyDelete();
      }
    };
    quill.root.addEventListener('beforeinput', onBeforeInput, true);

    const onKeyDown = (e) => {
      if (!e) return;
      const k = e.key;
      if (k !== 'Backspace' && k !== 'Delete') return;
      const range = quill.getSelection();
      if (!range) return;
      const dir = (k === 'Backspace') ? 'backward' : 'forward';
      if (willDeleteKpAnchor(range, dir)){
        e.preventDefault();
        e.stopPropagation();
        denyDelete();
      }
    };
    quill.root.addEventListener('keydown', onKeyDown, true);
  }catch{}

  try{
    quill.keyboard.addBinding({ key: 8 }, (range) => { // backspace
      if (!range) return true;

      // If selection range includes a KP anchor, block
      if (range.length > 0){
        try{
          const d = quill.getContents(range.index, range.length);
          const has = (d && d.ops || []).some(op => op && op.insert && op.insert.kpanchor);
          if (has){ denyDelete(); return false; }
        }catch{}
        return true;
      }
      if (range.index <= 0) return true;
      const [leaf] = quill.getLeaf(range.index - 1);
      if (leaf && leaf.statics && leaf.statics.blotName === "kpanchor"){
        denyDelete();
        return false;
      }
      return true;
    });
    quill.keyboard.addBinding({ key: 46 }, (range) => { // delete
      if (!range) return true;

      // If selection range includes a KP anchor, block
      if (range.length > 0){
        try{
          const d = quill.getContents(range.index, range.length);
          const has = (d && d.ops || []).some(op => op && op.insert && op.insert.kpanchor);
          if (has){ denyDelete(); return false; }
        }catch{}
        return true;
      }
      const [leaf] = quill.getLeaf(range.index);
      if (leaf && leaf.statics && leaf.statics.blotName === "kpanchor"){
        denyDelete();
        return false;
      }
      return true;
    });
  }catch{}

  // Toolbar hint for selected KP anchor
  try{
    const toolbar = quill.getModule("toolbar");
    const toolbarEl = toolbar && toolbar.container ? toolbar.container : null;
    if (toolbarEl && !toolbarEl.querySelector(".kp-toolbar-hint")){
      const hint = document.createElement("span");
      hint.className = "kp-toolbar-hint";
      hint.style.display = "none";
      hint.innerHTML = '<span>🔒</span><span class="muted">KPメモ:</span><span class="kp-title"></span><button type="button" title="開く">開く</button>';
      toolbarEl.appendChild(hint);
      hint.querySelector("button").addEventListener("click", () => {
        const id = hint.dataset.kpId;
        if (id) {
          const card = document.getElementById(`kp-edit-${id}`);
          if (card) {
            card.scrollIntoView({ behavior: "smooth", block: "center" });
            const ta = card.querySelector("textarea");
            if (ta) ta.focus();
          } else {
            try { openKpPanel(String(id)); } catch {}
          }
        }
      });

      quill.on("selection-change", (range) => {
        try{
          if (!range){ hint.style.display="none"; return; }
          const [leaf] = quill.getLeaf(range.index);
          const blot = leaf;
          if (blot && blot.statics && blot.statics.blotName === "kpanchor"){
            const id = blot.domNode && (blot.domNode.dataset.kpId || blot.domNode.getAttribute("data-kp-id"));
            const s = getCurrentScenario();
            let title = "（無題）";
            if (s && id){
              const memo = getKpMemoById(s, String(id));
              if (memo && memo.title && String(memo.title).trim()) title = String(memo.title).trim();
            }

            hint.querySelector(".kp-title").textContent = title;
            hint.style.display = "inline-flex";
          } else {
            hint.style.display = "none";
          }
        }catch{
          hint.style.display = "none";
        }
      });
    }
  }catch{}
}

  try {
    const getGroup = (line) => {
      const name = line.getAttribute("data-ccfolia-name") || "";
      const group = [line];
      // 前方向
      let p = line.previousElementSibling;
      while (p && p.classList && p.classList.contains("ccfolia-line") && (p.getAttribute("data-ccfolia-name") || "") === name) {
        group.unshift(p);
        p = p.previousElementSibling;
      }
      // 後方向
      let n = line.nextElementSibling;
      while (n && n.classList && n.classList.contains("ccfolia-line") && (n.getAttribute("data-ccfolia-name") || "") === name) {
        group.push(n);
        n = n.nextElementSibling;

      return group;
    };
    document.addEventListener("mouseover", (e) => {
      const t = e.target;
      if (!(t instanceof HTMLElement)) return;
      const line = t.closest(".view-content .ccfolia-line");
      if (!line) return;
      getGroup(line).forEach(el => el.classList.add("ccfolia-group-hover"));
    });
    document.addEventListener("mouseout", (e) => {
      const t = e.target;
      if (!(t instanceof HTMLElement)) return;
      const line = t.closest(".view-content .ccfolia-line");
      if (!line) return;
      // 関連先もccfoliaグループなら残す
      const related = e.relatedTarget;
      if (related instanceof HTMLElement && related.closest(".view-content .ccfolia-line")) {
        const relatedLine = related.closest(".view-content .ccfolia-line");
        const curName = line.getAttribute("data-ccfolia-name") || "";
        const relName = relatedLine.getAttribute("data-ccfolia-name") || "";
        if (curName === relName) return; // 同じグループ内移動なら何もしない
      }
      getGroup(line).forEach(el => el.classList.remove("ccfolia-group-hover"));

  /**
   * Character Count (章単位)
   */
  function updateCharCount() {
    const el = document.getElementById("charCount");
    if (!el) return;
    const s = getCurrentScenario();
    if (!s) { el.textContent = "0 字"; return; }
    const chId = s.currentChapterId;
    const ch = (s.chapters || []).find(c => c.id === chId);
    if (!ch) { el.textContent = "0 字"; return; }
    let total = 0;
    (ch.scenes || []).forEach(sc => {
      total += stripHtmlToText(sc.body || "").length;
    });
    el.textContent = total.toLocaleString() + " 字";
  }

  // Debounced char count update
  let __charCountTimer = null;
  function scheduleCharCountUpdate() {
    if (__charCountTimer) clearTimeout(__charCountTimer);
    __charCountTimer = setTimeout(updateCharCount, 500);
  }

  /**
   * Scene Collapse (折りたたみ)
   */
  const __sceneCollapsed = new Set();

  function toggleSceneCollapse(sceneId) {
    if (__sceneCollapsed.has(sceneId)) {
      __sceneCollapsed.delete(sceneId);
      // Lazy init: if scene was collapsed and has no Quill yet, re-render the editor
      const bodyWrap = document.querySelector(`#sc-${CSS.escape(sceneId)} .scene-body-wrap`);
      if (bodyWrap && !bodyWrap.querySelector('.ql-editor')) {
        captureScroll();
        renderEditor();
        restoreScroll();
        return;
      }
    } else {
      __sceneCollapsed.add(sceneId);
    }
    const bodyWrap = document.querySelector(`#sc-${CSS.escape(sceneId)} .scene-body-wrap`);
    const btn = document.querySelector(`#sc-${CSS.escape(sceneId)} .scene-collapse-btn`);
    if (bodyWrap) bodyWrap.classList.toggle("collapsed", __sceneCollapsed.has(sceneId));
    if (btn) btn.classList.toggle("collapsed", __sceneCollapsed.has(sceneId));
  }

  /**
   * Chapter Duplicate (章の複製)
   */
  function duplicateChapter(s, chapterId) {
    const ch = (s.chapters || []).find(c => c.id === chapterId);
    if (!ch) return;
    const clone = deepClone(ch);
    clone.id = generateId();
    clone.title = ch.title + "（複製）";
    (clone.scenes || []).forEach(sc => { sc.id = generateId(); });
    const idx = s.chapters.indexOf(ch);
    s.chapters.splice(idx + 1, 0, clone);
    s.currentChapterId = clone.id;
    s.updatedAt = Date.now();
    saveApp();
    setHashChapter(clone.id, { push: true });
    renderEditor();
    showToast("章を複製しました");
  }

        showToast(ok ? "コピーしました！" : "コピーに失敗しました");
      };

      // Delete button
      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "kp-del-inline";
      delBtn.textContent = "削除";
      delBtn.onclick = () => {
        if (!confirm("このKPメモを削除しますか？")) return;
        const idx = (scenario.kpMemos || []).findIndex(n => n.id === memo.id);
        if (idx !== -1) scenario.kpMemos.splice(idx, 1);
        try { removeKpAnchorsEverywhere(memo.id); } catch {}
        scenario.updatedAt = Date.now();
        saveApp();
        renderSceneKpSection(container, sceneId, chapterId, scenario);
      };

      tools.appendChild(anchorBtn);
      tools.appendChild(copyBtn);
      tools.appendChild(delBtn);
      headRow.appendChild(titleInput);
      headRow.appendChild(tools);

      // Body
      const bodyDiv = document.createElement("div");
      bodyDiv.className = "scene-kp-card-body";
      const ta = document.createElement("textarea");
      ta.placeholder = "KPのみが見る情報を入力...";
      ta.value = memo.body || "";
      ta.addEventListener("input", () => {
        memo.body = ta.value;
        memo.updatedAt = Date.now();
        scenario.updatedAt = Date.now();
        saveApp();
      });
      bodyDiv.appendChild(ta);

      card.appendChild(headRow);
      card.appendChild(bodyDiv);
      container.appendChild(card);
    });
  }

  /**
   * Inline KP Notes — View Mode
   * Injects KP notes at anchor positions in rendered HTML.
   */
  function injectKpNotesInView(contentDiv, sceneId, scenario) {
    if (!contentDiv || !scenario) return;
    ensureKpMemos(scenario);
    const sid = String(sceneId || "");
    const memos = (scenario.kpMemos || []).filter(n => n.sceneId === sid);
    if (memos.length === 0) return;

    const memoMap = new Map();
    memos.forEach(m => memoMap.set(m.id, m));

    // Find anchors and inject KP blocks after them
    const anchors = contentDiv.querySelectorAll(".kp-anchor[data-kp-id]");
    const injectedIds = new Set();

    anchors.forEach(anchor => {
      const memoId = anchor.dataset.kpId || anchor.getAttribute("data-kp-id");
      if (!memoId) return;
      const memo = memoMap.get(memoId);
      if (!memo) return;
      injectedIds.add(memoId);

      const block = createKpInlineViewBlock(memo);

      // Insert after the anchor's parent paragraph, or after the anchor itself
      const parentP = anchor.closest("p, div:not(.view-content)");
      const insertAfter = parentP || anchor;
      if (insertAfter.parentNode) {
        insertAfter.parentNode.insertBefore(block, insertAfter.nextSibling);
      }
    });

    // Add orphan memos (those without anchors in this scene)
    const orphans = memos.filter(m => !injectedIds.has(m.id));
    if (orphans.length > 0) {
      const orphanSection = document.createElement("div");
      orphanSection.className = "kp-orphan-section";
      const orphanTitle = document.createElement("div");
      orphanTitle.className = "kp-orphan-title";
      orphanTitle.textContent = "🔒 その他のKPメモ";
      orphanSection.appendChild(orphanTitle);
      orphans.forEach(m => {
        orphanSection.appendChild(createKpInlineViewBlock(m));
      });
      contentDiv.appendChild(orphanSection);
    }
  }

  function createKpInlineViewBlock(memo) {
    const block = document.createElement("div");
    block.className = "kp-inline-view";
    block.dataset.kpId = memo.id;

    const head = document.createElement("div");
    head.className = "kp-inline-view-head";
    const badge = document.createElement("span");
    badge.className = "kp-inline-view-badge";
    badge.textContent = "🔒";
    const title = document.createElement("span");
    title.className = "kp-inline-view-title";
    title.textContent = (memo.title && memo.title.trim()) ? memo.title : "KPメモ";

    const copyBtn = document.createElement("button");
    copyBtn.type = "button";
    copyBtn.className = "kp-inline-view-copy";
    copyBtn.textContent = "Copy";
    copyBtn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const ok = await copyTextToClipboard(String(memo.body || "").replace(/\s+$/,""));
      showToast(ok ? "コピーしました！" : "コピーに失敗しました");
    });

    head.appendChild(badge);
    head.appendChild(title);
    head.appendChild(copyBtn);

    const body = document.createElement("div");
    body.className = "kp-inline-view-body";
    body.textContent = memo.body || "（内容なし）";

    block.appendChild(head);
    block.appendChild(body);
    return block;
  }

  /**
   * ココフォリア用ZIPエクスポート
   * シーンマーカー（.ccfolia-line）を収集し、__data.json入りZIPを生成する。
   * 同名マーカーは1つのココフォリアシーンに統合（グループフラッシュと同じ扱い）。
   */
  function collectCcfoliaScenes(s) {
    const groups = [];
    const byName = new Map();
    const NBSP_PH = '\uFFF9', IDESP_PH = '\uFFFA';
    (s.chapters || []).forEach(ch => {
      (ch.scenes || []).forEach(sc => {
        if (!sc || !sc.body) return;
        const div = document.createElement("div");
        div.innerHTML = String(sc.body)
          .replace(/&nbsp;/g, NBSP_PH); // &nbsp;実体参照を保護
        div.querySelectorAll(".ccfolia-line").forEach(line => {
          const name = (line.getAttribute("data-ccfolia-name") || "").trim() || "無題シーン";
          const text = (line.textContent || "")
            .replace(new RegExp(NBSP_PH, 'g'), '\u00A0')
            .replace(new RegExp(IDESP_PH, 'g'), '\u3000');
          if (byName.has(name)) {
            byName.get(name).lines.push(text);
          } else {
            const g = { name, lines: [text] };
            byName.set(name, g);
            groups.push(g);
          }
        });
      });
    });
    return groups;
  }

  function randomCcfoliaId(len = 20) {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    let out = "";
    const buf = new Uint8Array(len);
    (window.crypto || {}).getRandomValues ? crypto.getRandomValues(buf) : buf.forEach((_, i) => buf[i] = Math.floor(Math.random() * 256));
    for (let i = 0; i < len; i++) out += chars[buf[i] % chars.length];
    return out;
  }

  // 無圧縮(stored)ZIP生成（依存ライブラリなし）
  const __crcTable = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(bytes) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = __crcTable[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function buildStoredZip(files) {
    // files: [{ name: string, data: Uint8Array }]
    const enc = new TextEncoder();
    const chunks = [];
    const central = [];
    let offset = 0;
    const u16 = v => new Uint8Array([v & 0xFF, (v >>> 8) & 0xFF]);
    const u32 = v => new Uint8Array([v & 0xFF, (v >>> 8) & 0xFF, (v >>> 16) & 0xFF, (v >>> 24) & 0xFF]);
    files.forEach(f => {
      const nameB = enc.encode(f.name);
      const crc = crc32(f.data);
      const size = f.data.length;
      // Local file header
      const local = [
        u32(0x04034b50), u16(20), u16(0x0800) /* UTF-8 flag */, u16(0) /* stored */,
        u16(0), u16(0) /* time/date */, u32(crc), u32(size), u32(size),
        u16(nameB.length), u16(0)
      ];
      const localLen = local.reduce((a, b) => a + b.length, 0) + nameB.length + size;
      local.forEach(b => chunks.push(b));
      chunks.push(nameB, f.data);
      // Central directory entry
      central.push({ nameB, crc, size, offset });
      offset += localLen;
    });
    const cdStart = offset;
    let cdSize = 0;
    central.forEach(e => {
      const rec = [
        u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0),
        u16(0), u16(0), u32(e.crc), u32(e.size), u32(e.size),
        u16(e.nameB.length), u16(0), u16(0), u16(0), u16(0),
        u32(0), u32(e.offset)
      ];
      rec.forEach(b => chunks.push(b));
      chunks.push(e.nameB);
      cdSize += rec.reduce((a, b) => a + b.length, 0) + e.nameB.length;
    });
    const eocd = [
      u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
      u32(cdSize), u32(cdStart), u16(0)
    ];
    eocd.forEach(b => chunks.push(b));
    const total = chunks.reduce((a, b) => a + b.length, 0);
    const out = new Uint8Array(total);
    let p = 0;
    chunks.forEach(b => { out.set(b, p); p += b.length; });
    return out;
  }

  function exportCcfoliaZip() {
    const s = getCurrentScenario();
    if (!s) { alert("出力するシナリオがありません。"); return; }
    const groups = collectCcfoliaScenes(s);
    if (!groups.length) {
      showToast("シーンマーカー（🎬）が見つかりません");
      return;
    }
    const scenes = {};
    groups.forEach((g, i) => {
      scenes[randomCcfoliaId()] = {
        name: g.name,
        text: g.lines.join("\n"),
        order: i,
        locked: false,
        backgroundUrl: "",
        foregroundUrl: "",
        fieldWidth: 0,
        fieldHeight: 0,
        markers: {}
      };
    });
    // ココフォリアはトップキーの欠落で読み込みを拒否するため、空値で全キーを埋める
    const room = {
      backgroundUrl: "",
      foregroundUrl: "",
      thumbnailUrl: null,
      mapType: null,
      fieldWidth: 0,
      fieldHeight: 0,
      messageChannels: [],
      markers: {},
      monitored: false,
      sceneId: null,
      archived: false,
      underConstruction: false
    };
    const data = {
      meta: { version: "1.1.0" },
      entities: {
        room,
        items: {},
        decks: {},
        characters: {},
        effects: {},
        scenes
      },
      resources: {}
    };
    const jsonBytes = new TextEncoder().encode(JSON.stringify(data));
    const zipBytes = buildStoredZip([{ name: "__data.json", data: jsonBytes }]);
    const blob = new Blob([zipBytes], { type: "application/zip" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${(s.title || "scenario")}_ccfolia.zip`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast(`ココフォリア用ZIPを出力しました（${groups.length}シーン）`);
  }

  // 書き出し用に、参照されている画像の実データを同梱する
  async function buildImageBundle(ids) {
    const list = Array.from(ids);
    const missing = list.filter(id => !__imageCache.has(id));
    if (missing.length) {
      await loadImagesFromLocal(missing);
      const still = missing.filter(id => !__imageCache.has(id));
      if (still.length) await loadImagesFromCloud(still);
    }
    const bundle = {};
    let lost = 0;
    for (const id of list) {
      const d = __imageCache.get(id);
      if (d) bundle[id] = d; else lost++;
    }
    return { bundle, lost };
  }

  async function exportAllAsJSON() {
    normalizeAppData();
    const { bundle, lost } = await buildImageBundle(allImageIds());
    const payload = {
      version: 2,
      exportedAt: new Date().toISOString(),
      app,
      images: bundle
    };
    downloadTextFile("trpg_writer_all.json", JSON.stringify(payload, null, 2));
    if (lost) showToast(`警告: ${lost}件の画像を取得できず、同梱できませんでした`);
  }

  function reIdScenario(originalScenario) {
    // Deep clone then re-ID chapters/scenes to avoid collisions.
    const s = deepClone(originalScenario || {});
    s.id = generateId();
    s.mode = "edit";
    s.updatedAt = Date.now();
    if (!Array.isArray(s.chapters)) s.chapters = [];

    const sceneIdMap = {}; // 旧シーンID -> 新シーンID

    s.chapters.forEach(ch => {
      ch.id = generateId();
      if (!Array.isArray(ch.scenes)) ch.scenes = [];
      ch.scenes.forEach(sc => {
        const oldSceneId = sc.id;
        sc.id = generateId();
        if (oldSceneId) sceneIdMap[oldSceneId] = sc.id;
        // 本文中のKPアンカーが持つ data-scene-id も新IDへ更新
        if (typeof sc.body === "string" && oldSceneId && sc.body.indexOf('data-scene-id="' + oldSceneId + '"') !== -1) {
          sc.body = sc.body.split('data-scene-id="' + oldSceneId + '"').join('data-scene-id="' + sc.id + '"');
        }
        if (!Array.isArray(sc.tags)) sc.tags = [];
        if (!SCENE_STATUS[sc.status]) sc.status = "unused";
        if (!("body" in sc)) sc.body = "";
      });
    });

    // KPメモのシーン参照を新IDへ張り替える（メモID自体は本文アンカーと対応するため変更しない）
    if (Array.isArray(s.kpMemos)) {
      s.kpMemos.forEach(m => {
        if (m && typeof m.sceneId === "string" && sceneIdMap[m.sceneId]) {
          m.sceneId = sceneIdMap[m.sceneId];
        }
      });
    }

    s.currentChapterId = s.chapters[0]?.id || null;
    normalizeScenarioData(s);
    return s;
  }

  function importJSONFromText(text) {
    let data;
    try { data = JSON.parse(text); } catch { alert("JSONの読み込みに失敗しました。"); return; }

    let scenarios = null;

    if (data && typeof data === "object") {
      if (Array.isArray(data.scenarios)) scenarios = data.scenarios;
      else if (data.app && Array.isArray(data.app.scenarios)) scenarios = data.app.scenarios;
      else if (data.scenario && typeof data.scenario === "object") scenarios = [data.scenario];
      else if (data.chapters || data.title) scenarios = [data]; // scenario single
    }

    if (!scenarios || scenarios.length === 0) {
      alert("取り込めるシナリオが見つかりませんでした。");
      return;
    }

    // 同梱された画像を取り込む。IDが既存と衝突しないよう振り直し、本文の参照も追従させる。
    const idMap = Object.create(null);
    try {
      const bundle = (data && data.images && typeof data.images === "object") ? data.images : null;
      if (bundle) {
        for (const oldId of Object.keys(bundle)) {
          const dataUrl = bundle[oldId];
          if (typeof dataUrl !== "string" || dataUrl.indexOf("data:") !== 0) continue;
          const newRef = putImage(dataUrl);
          idMap[oldId] = imageIdFromRef(newRef);
        }
      }
    } catch (err) {
      try { console.warn("image bundle import failed:", err); } catch {}
    }

    const remapRefs = (sc) => {
      if (!Object.keys(idMap).length) return sc;
      try {
        for (const ch of (sc && sc.chapters) || []) {
          for (const scene of (ch && ch.scenes) || []) {
            if (!scene || typeof scene.body !== "string") continue;
            scene.body = scene.body.replace(/trpgimg:(im_[a-z0-9_]+)/gi,
              (whole, id) => idMap[id] ? (IMAGE_REF_PREFIX + idMap[id]) : whole);
          }
        }
      } catch {}
      return sc;
    };

    const imported = scenarios.map(sc => remapRefs(reIdScenario(sc)));

    // 旧形式（画像がBase64で本文に埋まっているファイル）も取り込めるようにする
    app.scenarios.unshift(...imported);
    try { migrateInlineImages(); } catch {}

    app.currentScenarioId = imported[0].id;
    saveApp();
    renderEditor();
    showToast("JSONを読み込みました");
  }

  /**
   * Full-text Search
   */
  function stripHtmlToText(html) {
    if (!html) return "";
    const tmp = document.createElement("div");
    tmp.innerHTML = html;
    return (tmp.textContent || tmp.innerText || "").replace(/\s+/g, " ").trim();
  }

  function buildSearchIndex(s) {
    normalizeScenarioData(s);
    const rows = [];
    (s.chapters || []).forEach(ch => {
      (ch.scenes || []).forEach(sc => {
        const bodyText = stripHtmlToText(sc.body);
        rows.push({
          chapterId: ch.id,
          chapterTitle: ch.title || "",
          sceneId: sc.id,
          sceneTitle: sc.title || "",
          tags: Array.isArray(sc.tags) ? sc.tags.join(", ") : "",
          status: SCENE_STATUS[sc.status]?.label || "",
          bodyText
        });
      });
    });
    return rows;
  }

  function openSearch() {
    const modal = document.getElementById("searchModal");
    const input = document.getElementById("searchInput");
    if (!modal || !input) return;
    modal.classList.add("show");
    modal.setAttribute("aria-hidden", "false");
    input.value = "";
    updateSearchResults("");
    setTimeout(() => input.focus(), 0);
  }

  function closeSearch() {
    const modal = document.getElementById("searchModal");
    if (!modal) return;
    modal.classList.remove("show");
    modal.setAttribute("aria-hidden", "true");
  }

  function updateSearchResults(query) {
    const s = getCurrentScenario();
    const resultsEl = document.getElementById("searchResults");
    if (!resultsEl) return;
    resultsEl.innerHTML = "";

    if (!s) {
      resultsEl.innerHTML = `<div style="padding:16px; color:var(--text-muted);">検索できるシナリオがありません。</div>`;
      return;
    }

    const q = (query || "").trim().toLowerCase();
    const index = buildSearchIndex(s);

    const hits = q
      ? index.filter(r => {
          const hay = (r.chapterTitle + " " + r.sceneTitle + " " + r.tags + " " + r.status + " " + r.bodyText).toLowerCase();
          return hay.includes(q);
        })
      : index.slice(0, 30); // empty query: show first scenes as quick jump

    if (hits.length === 0) {
      resultsEl.innerHTML = `<div style="padding:16px; color:var(--text-muted);">該当なし</div>`;
      return;
    }

    const limit = 80;
    hits.slice(0, 200).forEach(r => {
      const item = document.createElement("div");
      item.className = "search-item";
      const snippetSource = r.bodyText || "";
      const snippet = snippetSource.length > limit ? snippetSource.slice(0, limit) + "…" : snippetSource;
      item.innerHTML = `
        <div class="si-title">${escapeHtml(r.sceneTitle || "（無題）")}</div>
        <div class="si-meta">章: ${escapeHtml(r.chapterTitle || "（無題）")} / ${escapeHtml(r.status || "")}${r.tags ? " / タグ: " + escapeHtml(r.tags) : ""}</div>
        <div class="si-snippet">${escapeHtml(snippet)}</div>
      `;
      item.onclick = () => {
        closeSearch();
        jumpToScene(r.chapterId, r.sceneId);
      };
      resultsEl.appendChild(item);
    });
  }

  function jumpToScene(chapterId, sceneId) {
    const s = getCurrentScenario();
    if (!s) return;

    // Move to the chapter first (keeps mode).
    s.currentChapterId = chapterId;
    setHashChapter(chapterId, { push: false });
    saveApp();
    renderEditor();

    // Wait for DOM render then scroll.
    setTimeout(() => {
      const isView = (s.mode === "view");
      const el = document.getElementById(isView ? `view-sc-${sceneId}` : `sc-${sceneId}`);
      if (el) {
        el.scrollIntoView({ behavior: "smooth", block: "start" });
        el.classList.add("jump-flash");
        setTimeout(() => { try { el.classList.remove("jump-flash"); } catch {} }, 900);
      }
    }, 0);
  }

  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, s => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[s]));
  }

  /**
   * Browser-like Find & Replace (works on rendered Quill editors in edit mode)
   */
  const FindBar = (function(){
    let matches = [];      // { quill, index, length }
    let current = -1;
    let caseSensitive = false;

    const $ = (id) => document.getElementById(id);

    function getEditors(){
      return Array.from(document.querySelectorAll("#chapters .ql-container"))
        .map(c => c.__quill)
        .filter(Boolean);
    }

    // Quill index <-> plain text map (embeds count as 1 non-matchable char)
    function buildIndexMap(quill){
      const ops = quill.getContents().ops || [];
      let text = "", map = [], qi = 0;
      for (const op of ops){
        if (typeof op.insert === "string"){
          const str = op.insert;
          for (let k=0;k<str.length;k++){ text += str[k]; map.push(qi); qi++; }
        } else {
          text += "\uFFFF"; map.push(qi); qi++;
        }
      }
      return { text, map };
    }

    function clearHighlights(){
      document.querySelectorAll(".find-hl").forEach(el => el.remove());
    }

    function buildMatches(query){
      matches = [];
      if (!query) return;
      const needle = caseSensitive ? query : query.toLowerCase();
      const editors = getEditors();
      for (const quill of editors){
        const { text, map } = buildIndexMap(quill);
        const hay = caseSensitive ? text : text.toLowerCase();
        let from = 0, pos;
        while ((pos = hay.indexOf(needle, from)) !== -1){
          matches.push({ quill, index: map[pos], length: query.length });
          from = pos + needle.length;
        }
      }
    }

    function renderHighlights(){
      clearHighlights();
      matches.forEach((m, i) => {
        let b;
        try { b = m.quill.getBounds(m.index, m.length); } catch { b = null; }
        if (!b) return;
        const hl = document.createElement("div");
        hl.className = "find-hl" + (i === current ? " current" : "");
        hl.style.left = b.left + "px";
        hl.style.top = b.top + "px";
        hl.style.width = Math.max(b.width, 2) + "px";
        hl.style.height = b.height + "px";
        m.quill.container.appendChild(hl);
      });
    }

    function updateCount(){
      const el = $("findCount");
      if (!el) return;
      el.textContent = matches.length ? `${current + 1} / ${matches.length}` : "0 件";
    }

    function scrollToCurrent(){
      if (current < 0 || !matches[current]) return;
      const cur = document.querySelector(".find-hl.current");
      if (cur && cur.scrollIntoView) cur.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function search(resetCurrent){
      const input = $("findInput");
      const query = input ? input.value : "";
      buildMatches(query);
      if (matches.length === 0) current = -1;
      else if (resetCurrent || current < 0 || current >= matches.length) current = 0;
      renderHighlights();
      updateCount();
      scrollToCurrent();
    }

    function move(dir){
      if (matches.length === 0){ search(true); if (matches.length === 0) return; }
      current = (current + dir + matches.length) % matches.length;
      renderHighlights();
      updateCount();
      scrollToCurrent();
    }

    function replaceCurrent(){
      if (current < 0 || !matches[current]) { search(true); return; }
      const rep = ($("replaceInput") || {}).value || "";
      const m = matches[current];
      try {
        m.quill.deleteText(m.index, m.length);
        if (rep) m.quill.insertText(m.index, rep);
        if (typeof m.quill.__flushSave === "function") m.quill.__flushSave();
      } catch {}
      try { saveApp(); } catch {}
      const prev = current;
      search(false);
      if (matches.length){ current = Math.min(prev, matches.length - 1); renderHighlights(); updateCount(); scrollToCurrent(); }
    }

    function replaceAll(){
      const input = $("findInput");
      const query = input ? input.value : "";
      if (!query) return;
      const rep = ($("replaceInput") || {}).value || "";
      const needle = caseSensitive ? query : query.toLowerCase();
      let count = 0;
      for (const quill of getEditors()){
        // collect this editor's matches, then replace from last to first
        const local = [];
        const { text, map } = buildIndexMap(quill);
        const hay = caseSensitive ? text : text.toLowerCase();
        let from = 0, pos;
        while ((pos = hay.indexOf(needle, from)) !== -1){
          local.push(map[pos]);
          from = pos + needle.length;
        }
        if (!local.length) continue;
        for (let i = local.length - 1; i >= 0; i--){
          try {
            quill.deleteText(local[i], query.length);
            if (rep) quill.insertText(local[i], rep);
            count++;
          } catch {}
        }
        // この時点でこのエディタの本文を確実にメモリへ反映（共有デバウンスで取りこぼさないため）
        try { if (typeof quill.__flushSave === "function") quill.__flushSave(); } catch {}
      }
      try { saveApp(); } catch {}
      search(true);
      try { showToast(`${count} 件を置換しました`); } catch {}
    }

    function open(){
      const bar = $("findBar");
      if (!bar) return;
      bar.classList.add("show");
      bar.setAttribute("aria-hidden", "false");
      const input = $("findInput");
      // seed with current selection text if any
      const sel = (window.getSelection && String(window.getSelection())) || "";
      if (input){
        if (sel && sel.trim() && sel.length < 80) input.value = sel.trim();
        input.focus();
        input.select();
      }
      caseSensitive = !!(caseSensitive);
      const caseBtn = $("findCase");
      if (caseBtn) caseBtn.classList.toggle("active", caseSensitive);
      search(true);
    }

    function close(){
      const bar = $("findBar");
      if (!bar) return;
      bar.classList.remove("show");
      bar.setAttribute("aria-hidden", "true");
      clearHighlights();
      matches = []; current = -1;
    }

    function isOpen(){
      const bar = $("findBar");
      return bar && bar.classList.contains("show");
    }

    function bind(){
      const findInput = $("findInput");
      const replaceInput = $("replaceInput");
      if (findInput){
        findInput.addEventListener("input", () => search(true));
        findInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter"){ e.preventDefault(); move(e.shiftKey ? -1 : 1); }
          else if (e.key === "Escape"){ e.preventDefault(); close(); }
        });
      }
      if (replaceInput){
        replaceInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter"){ e.preventDefault(); replaceCurrent(); }
          else if (e.key === "Escape"){ e.preventDefault(); close(); }
        });
      }
      const on = (id, fn) => { const el = $(id); if (el) el.addEventListener("click", fn); };
      on("findNext", () => move(1));
      on("findPrev", () => move(-1));
      on("findClose", close);
      on("replaceOne", replaceCurrent);
      on("replaceAll", replaceAll);
      on("findToggleReplace", () => {
        const bar = $("findBar"); if (!bar) return;
        bar.classList.toggle("replace-open");
        $("findToggleReplace").classList.toggle("active", bar.classList.contains("replace-open"));
        if (bar.classList.contains("replace-open")) { const r = $("replaceInput"); if (r) r.focus(); }
      });
      on("findCase", () => {
        caseSensitive = !caseSensitive;
        $("findCase").classList.toggle("active", caseSensitive);
        search(true);
      });
    }

    return { open, close, isOpen, bind };
  })();

static initSortable(gridElement, containerNode) {
  // Prevent multiple Sortable instances on the same grid (re-render / append cases)
  try {
    if (gridElement.__sortable) {
      gridElement.__sortable.destroy();
      gridElement.__sortable = null;
    }
  } catch {}

  // In View mode we still keep the markup, but we do not want drag behavior to interfere with navigation.
  // Use delay/distance to avoid accidental drags that can leave "fallback" artifacts covering the UI.
  gridElement.__sortable = new Sortable(gridElement, {
    animation: 150,
    draggable: ".gallery-item",
    handle: ".img-handle",
    delay: 160,
    delayOnTouchOnly: true,
    distance: 6,

    onStart: () => { document.body.classList.add('sortable-dragging'); },
    onCancel: () => { try { document.body.classList.remove('sortable-dragging'); } catch {} cleanupSortableArtifacts(); },
    ghostClass: "sortable-ghost",

    filter: ".img-x",
    preventOnFilter: true,

    // Fallback is useful across browsers, but can leave artifacts if the drag is interrupted.
    // We keep it, and aggressively clean up in multiple lifecycle hooks.
    forceFallback: true,
    fallbackOnBody: false,

    onEnd: () => {
      try { document.body.classList.remove('sortable-dragging'); } catch {}
      cleanupSortableArtifacts();
      const newImages = Array.from(gridElement.querySelectorAll(".gallery-item img"))
        .map(img => img.getAttribute("data-img-ref") || img.getAttribute("src"))
        .filter(Boolean);

      containerNode.dataset.images = JSON.stringify(newImages);

      if (newImages.length === 0) {
        containerNode.dispatchEvent(new CustomEvent("gallery-empty", { bubbles: true }));
      } else {
        containerNode.dispatchEvent(new Event("gallery-changed", { bubbles: true }));
      }
    }
  });
}


    static renderImages(grid, images) {
      grid.innerHTML = "";
      images.forEach((src) => {
        const item = document.createElement("div");
        item.className = "gallery-item";

        const img = document.createElement("img");
        // src には解決済みデータを入れるが、保存対象は data-img-ref の参照文字列
        img.setAttribute("data-img-ref", src);
        img.src = resolveImageSrc(src);
        img.draggable = false;

        // Drag handle (to avoid accidental drag that can interfere with text input)
        const handle = document.createElement("div");
        handle.className = "img-handle";
        handle.textContent = "≡";

        // Delete button
        const btn = document.createElement("div");
        btn.className = "img-x";
        btn.textContent = "×";

        // Prevent Sortable/Quill from treating delete as drag or selection
        ["pointerdown","mousedown","touchstart"].forEach(ev => {
          btn.addEventListener(ev, (e) => { e.stopPropagation(); }, true);
        });

        // 画像削除の実行関数
        const doDelete = () => {
          item.remove();
          const currentList = Array.from(grid.querySelectorAll(".gallery-item img"))
            .map(x => x.getAttribute("data-img-ref") || x.getAttribute("src"))
            .filter(Boolean);
          const galleryNode = grid.closest(".img-gallery");
          if (galleryNode) {
            galleryNode.dataset.images = JSON.stringify(currentList);
            if (currentList.length === 0) {
              galleryNode.dispatchEvent(new CustomEvent("gallery-empty", { bubbles: true }));
            } else {
              galleryNode.dispatchEvent(new Event("gallery-changed", { bubbles: true }));
            }
          }
        };

        btn.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          doDelete();
        }, true);

        // スマホ: touchstartのpreventDefaultでclickが抑制されるため、touchendで直接処理
        btn.addEventListener("touchend", (e) => {
          e.preventDefault();
          e.stopPropagation();
          doDelete();
        }, true);

        item.appendChild(img);
        item.appendChild(handle);
        item.appendChild(btn);
        grid.appendChild(item);
      });
    }
  }
  Quill.register(ImgGalleryBlot, true);

// Quillのイベント干渉を防ぐためのヘルパー（Widget内の入力を優先）
function stopQuillPropagation(element) {
  try {
    if (!element || element.__trpgStopQuillPropagation) return;
    element.__trpgStopQuillPropagation = true;

    // Stop Quill from hijacking events inside widgets.
    let events = [
      "keydown","keypress","keyup",
      "beforeinput","input",
      "compositionstart","compositionupdate","compositionend",
      "paste","copy","cut",
      "mousedown","mouseup","click","dblclick","contextmenu",
      "pointerdown","pointerup","touchstart"
    ];

    events.forEach((evtName) => {
      element.addEventListener(evtName, (e) => {
        e.stopPropagation();
      }, true);
    });
  } catch {
    // ignore
  }
}






// --- Skill Check Widget (BlockEmbed) [Stable: no DOM attribute writes on input] ---
class SkillCheckBlot extends BlockEmbed {
  static blotName = "skillcheck";
  static tagName = "DIV";
  static className = "skill-check-widget";

  static create(value) {
    const node = super.create();
    node.setAttribute("contenteditable", "false");

    const payload = {
      name: (value && value.name) ? String(value.name) : "技能判定",
      success: (value && value.success) ? String(value.success) : "",
      failure: (value && value.failure) ? String(value.failure) : ""
    };
    node.dataset.payload = JSON.stringify(payload);

    // --- Header ---
    const head = document.createElement("div");
    head.className = "skill-check-head";

    const icon = document.createElement("span");
    icon.textContent = "🎲";

    const nameInput = document.createElement("input");
    nameInput.className = "skill-name-input";
    nameInput.type = "text";
    nameInput.value = payload.name;
    // Initial paint only (for persistence in raw HTML when exported)
    nameInput.setAttribute("value", payload.name);
    nameInput.placeholder = "技能名";

    stopQuillPropagation(nameInput);

    // IMPORTANT: do NOT mutate dataset/value attribute here (Quill MutationObserver can force redraw)
    nameInput.addEventListener("input", () => {
      // Save on focusout (handled globally) to keep caret stable.
    });

    head.appendChild(icon);
    head.appendChild(nameInput);

    const actions = document.createElement("div");
    actions.className = "skill-check-actions";
    const delBtn = document.createElement("button");
    delBtn.type = "button";
    delBtn.className = "skill-del-btn";
    delBtn.textContent = "×";
    delBtn.title = "削除";
    actions.appendChild(delBtn);
    head.appendChild(actions);

    // --- Body ---
    const body = document.createElement("div");
    body.className = "skill-check-body";

    const mkCol = (kind, labelText, initVal) => {
      const col = document.createElement("div");
      col.className = "skill-check-col " + kind;

      const top = document.createElement("div");
      top.className = "skill-check-col-head";
      top.innerHTML = `<div class="skill-check-label">${labelText}</div>`;

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "skill-copy-btn";
      btn.dataset.result = kind;
      btn.textContent = "Copy";
      top.appendChild(btn);

      const ta = document.createElement("textarea");
      ta.className = "skill-textarea";
      ta.dataset.result = kind;
      ta.value = initVal;
      // Initial paint only
      ta.textContent = initVal;
      ta.placeholder = kind === "success" ? "成功時テキスト…" : "失敗時テキスト…";
      ta.rows = 1;
      
      // Prevent Quill from stealing selection while typing inside the widget.
      stopQuillPropagation(ta);

      // Auto-grow textarea: prefer CSS field-sizing when supported (avoids Quill mutation side effects)
      const supportsFieldSizing = (typeof CSS !== "undefined" && CSS.supports && CSS.supports("field-sizing", "content"));

      if (!supportsFieldSizing) {
      const fitTa = () => {

              try {

                ta.style.height = "auto";

                ta.style.height = ta.scrollHeight + "px";

              } catch {}

            };

            // 初期表示（既存テキスト量に合わせて伸縮）

            try { requestAnimationFrame(fitTa); } catch { fitTa(); }



            const scheduleFitTa = () => {

              try { requestAnimationFrame(fitTa); } catch { setTimeout(fitTa, 0); }

            };



            // IMPORTANT: do NOT mutate dataset/textContent here

            // Use capture to ensure this runs even when propagation is stopped for Quill.

            ta.addEventListener("input", scheduleFitTa, true);

            // Some environments delay scrollHeight updates until after key/composition completes

            ta.addEventListener("keyup", (e) => { if (e && e.key === "Enter") scheduleFitTa(); }, true);

            ta.addEventListener("compositionend", scheduleFitTa, true);



            }

      col.appendChild(top);
      col.appendChild(ta);
      return col;
    };

    body.appendChild(mkCol("success", "成功時", payload.success));
    body.appendChild(mkCol("failure", "失敗時", payload.failure));

    node.appendChild(head);
    node.appendChild(body);
    return node;
  }

  static value(node) {
    // Prefer live values if available (editor runtime)
    try {
      const nameEl = node.querySelector && node.querySelector(".skill-name-input");
      const sEl = node.querySelector && node.querySelector('.skill-textarea[data-result="success"]');
      const fEl = node.querySelector && node.querySelector('.skill-textarea[data-result="failure"]');
      if (nameEl || sEl || fEl) {
        return {
          name: String((nameEl && (nameEl.value || nameEl.getAttribute("value"))) || "技能判定"),
          success: String((sEl && (sEl.value || sEl.textContent)) || ""),
          failure: String((fEl && (fEl.value || fEl.textContent)) || "")
        };
      }
    } catch {}

    // Fallback to stored payload
    try {
      const p = JSON.parse(node.dataset.payload || "{}");
      return {
        name: String(p.name || "技能判定"),
        success: String(p.success || ""),
        failure: String(p.failure || "")
      };
    } catch {
      return { name: "技能判定", success: "", failure: "" };
    }
  }
}
Quill.register(SkillCheckBlot, true);

function readFiles(files) {
    // Read and downscale images to keep the app responsive and avoid oversized localStorage payloads.
    // Output is a dataURL (JPEG) capped at a reasonable dimension.
    const maxDim = IMAGE_MAX_DIM; // px
    const quality = IMAGE_JPEG_QUALITY;

    const toDataURL = (file) => new Promise(resolve => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.readAsDataURL(file);
    });

    // 透過ピクセルを含むか判定（縮小描画後のcanvasを走査）
    const hasTransparency = (ctx, cw, ch) => {
      try {
        const data = ctx.getImageData(0, 0, cw, ch).data;
        for (let i = 3; i < data.length; i += 4) {
          if (data[i] < 255) return true;
        }
      } catch {}
      return false;
    };

    const downscale = (dataUrl, isPng) => new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        try {
          const w = img.naturalWidth || img.width;
          const h = img.naturalHeight || img.height;
          const scale = Math.min(1, maxDim / Math.max(w, h));
          const cw = Math.max(1, Math.round(w * scale));
          const ch = Math.max(1, Math.round(h * scale));

          const canvas = document.createElement('canvas');
          canvas.width = cw;
          canvas.height = ch;
          const ctx = canvas.getContext('2d'); // alpha有効で描画
          ctx.drawImage(img, 0, 0, cw, ch);

          // WebP は透過を保持しつつ軽量。非対応環境では従来通り PNG / JPEG にフォールバック
          const out = supportsWebP()
            ? canvas.toDataURL('image/webp', IMAGE_WEBP_QUALITY)
            : ((isPng && hasTransparency(ctx, cw, ch))
              ? canvas.toDataURL('image/png')
              : canvas.toDataURL('image/jpeg', quality));
          resolve(out);
        } catch {
          resolve(dataUrl);
        }
      };
      img.onerror = () => resolve(dataUrl);
      img.src = dataUrl;
    });

    const imgs = Array.from(files || []).filter(f => f && f.type && f.type.startsWith("image/"));
    return Promise.all(imgs.map(async (f) => {
      const raw = await toDataURL(f);
      const isPng = /png|webp|gif/i.test(f.type || '');
      const compressed = await downscale(raw, isPng);
      // 本文には参照だけを残し、実データは画像ストアが持つ
      return putImage(compressed);
    }));
  }

  const getHtml = () => {

    const liveWidgets = root.querySelectorAll('.kp-note, .skill-check-widget');

      if (!cloneNode) return;

      if (liveNode.classList.contains('kp-note')) {
        const liveTa = liveNode.querySelector('.kp-note-text');
        const cloneTa = cloneNode.querySelector('.kp-note-text');
        const liveTitle = liveNode.querySelector('.kp-note-title-input');
        const cloneTitle = cloneNode.querySelector('.kp-note-title-input');

        const payload = { title: '', text: '' };

        if (liveTitle && cloneTitle) {
          const val = liveTitle.value || '';
          cloneTitle.setAttribute('value', val);
          payload.title = val;
        }
        if (liveTa && cloneTa) {
          const val = liveTa.value || '';
          cloneTa.textContent = val;
          payload.text = val;
        }
        try {
          cloneNode.dataset.payload = JSON.stringify(payload);
        } catch {}
      }

      // --- 技能判定ボックスの同期 ---
      if (liveNode.classList.contains('skill-check-widget')) {
        const liveName = liveNode.querySelector('.skill-name-input');
        const cloneName = cloneNode.querySelector('.skill-name-input');

        const liveTaS = liveNode.querySelector('.skill-textarea[data-result="success"]');
        const cloneTaS = cloneNode.querySelector('.skill-textarea[data-result="success"]');

        const liveTaF = liveNode.querySelector('.skill-textarea[data-result="failure"]');
        const cloneTaF = cloneNode.querySelector('.skill-textarea[data-result="failure"]');

        const payload = { name: '', success: '', failure: '' };

        if (liveName && cloneName) {
          const val = liveName.value || '';
          cloneName.setAttribute('value', val); // inputはvalue属性にセット
          payload.name = val;
        }
        if (liveTaS && cloneTaS) {
          const val = liveTaS.value || '';
          cloneTaS.textContent = val; // textareaはtextContentにセット
          payload.success = val;
        }
        if (liveTaF && cloneTaF) {
          const val = liveTaF.value || '';
          cloneTaF.textContent = val;
          payload.failure = val;

        cloneNode.dataset.payload = JSON.stringify(payload);

  try {
